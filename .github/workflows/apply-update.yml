name: Apply site update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the update pieces together and apply them to index.html
        run: |
          cat update/part*.txt > update.patch
          sha256sum update.patch
          git apply --check update.patch
          git apply update.patch
          rm update.patch
          git rm -r -q update .github/workflows/apply-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Save students' progress in Supabase (keys come from repository secrets)"
          git push
