name: Apply site update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the update pieces together and apply them to index.html
        run: |
          cat update/part*.txt > update.patch
          git apply --ignore-whitespace --check update.patch
          git apply --ignore-whitespace update.patch
          rm update.patch
          echo "e05d8c70f303bb8af309fc7ec14c5a7d75f8d28ff2362b55bc079ae6a6a3a67a  index.html" | sha256sum -c -
          git rm -r -q update .github/workflows/apply-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add attendance with moving QR codes"
          git push
