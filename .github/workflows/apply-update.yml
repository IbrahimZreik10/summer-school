name: Apply site update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the update pieces together and apply them to index.html
        run: |
          cat update/part*.txt > update.patch
          git apply --ignore-whitespace --check update.patch
          git apply --ignore-whitespace update.patch
          rm update.patch
          echo "e70bb147c3f68a32c2c1f39ebf68d7202e6b63e1df9158b6424b4898b8bd8be0  index.html" | sha256sum -c -
          git rm -r -q update .github/workflows/apply-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Smarter professor assistant: answers many more questions from the site's data"
          git push
