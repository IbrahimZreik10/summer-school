name: Apply site update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the update pieces together and apply them to index.html
        run: |
          cat update/part*.txt > update.patch
          git apply --ignore-whitespace --check update.patch
          git apply --ignore-whitespace update.patch
          rm update.patch
          echo "78792c1c73a1093c98ec9dfd533ab7f65784df8b36c982d54c49358c15dd545c  index.html" | sha256sum -c -
          git rm -r -q update .github/workflows/apply-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Save students' progress in Supabase (keys come from repository secrets)"
          git push
