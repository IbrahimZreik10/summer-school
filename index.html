<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Summer School Is Cool</title>

<script>
  /* SAFETY NET (no need to edit)
     If a typo in this file stops the page from working, this shows a red box
     on the page with the line number, so you know where to look. */
  window.addEventListener("error", function (event) {
    function show() {
      if (document.getElementById("edit-error")) return;
      var box = document.createElement("div");
      box.id = "edit-error";
      box.setAttribute("role", "alert");
      box.style.cssText = "margin:16px;padding:16px;border:2px solid #A1232B;border-radius:12px;background:#FCEAEB;color:#17202E;font:16px/1.5 system-ui,sans-serif";
      box.textContent = "Something in index.html stopped the page from working (near line " + event.lineno + ": " + event.message + "). " +
        "If you just edited the file, check that change for a missing comma, quote mark or bracket, save the file and reload the page.";
      document.body.insertBefore(box, document.body.firstChild);
    }
    if (document.body) show(); else document.addEventListener("DOMContentLoaded", show);
  });
</script>

<style>
/* =====================================================================
   THEME: colours, fonts and sizes
   Change a value here and it updates everywhere on the site.
   Colours are hex codes (# and six characters). Keep text colours dark
   and backgrounds light so everything stays easy to read.
   ===================================================================== */
:root {
  /* Brand colours */
  --color-primary: #0B2E4F;          /* deep navy: main buttons, links, highlights */
  --color-primary-hover: #154270;    /* main buttons when the mouse is over them */
  --color-primary-soft: #E7EEF6;     /* pale navy: selected answers, chips */
  --color-primary-border: #C4D3E4;
  --color-accent: #9E1B32;           /* crimson: small accents such as "Dubai" in the top bar */
  --color-accent-soft: #F9ECEE;

  /* Page and cards */
  --color-page: #F5F6F8;             /* page background */
  --color-card: #FFFFFF;             /* card background */
  --color-card-alt: #F9FAFB;         /* slightly grey card background */
  --color-border: #DDE2E8;           /* subtle card borders */
  --color-border-strong: #AEB8C5;    /* borders of buttons and answer options */
  --color-track: #E2E6EB;            /* empty part of progress bars */

  /* Text */
  --color-text: #17202E;
  --color-text-muted: #4E5A6A;
  --color-on-primary: #FFFFFF;       /* text on navy buttons */
  --color-disabled-bg: #D5DAE1;
  --color-disabled-text: #4A5462;

  /* Messages and labels */
  --color-success: #1C6A3E;  --color-success-soft: #E5F3EA;  --color-success-border: #A9D5B9;
  --color-warning: #7F4D00;  --color-warning-soft: #FFF3DC;  --color-warning-border: #E3BE79;
  --color-danger:  #A1232B;  --color-danger-soft:  #FCEAEB;  --color-danger-border:  #E2A9AE;
  --color-focus:   #1F5FD6;          /* outline shown around whatever the keyboard is on */

  /* Banner backgrounds */
  --color-banner-fees: #E7EEF6;
  --color-banner-activities: #E8F4EC;
  --color-banner-support: #F9ECEE;
  --banner-shade: 8 30 52;            /* navy shade over the Home page photo banners (red green blue) */
  --color-banner-kicker: #F3D9A4;     /* light gold labels on the Home page banners */

  /* Welcome page entrance */
  --color-title-accent: #A0731E;      /* gold: "Is Cool" and the shimmer that runs through the title */
  --color-grid-line: rgba(11, 46, 79, 0.06);  /* faint grid behind the welcome page */
  --title-wave-duration: 6s;          /* time for one shimmer to run through the title and rest */
  --title-wave-step: 0.1s;            /* delay from one letter to the next */
  --title-wave-repeats: infinite;     /* how many shimmers: infinite, or a number such as 3 */
  --welcome-rise-duration: 0.75s;     /* how long each item takes to fade up when the page opens */
  --welcome-rise-step: 0.11s;         /* delay between items fading up */
  /* The shimmer and the fade-up switch off for anyone whose device asks for reduced motion. */

  /* Fonts (system fonts, so the site works offline) */
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-heading: var(--font-body);
  --font-display: Georgia, "Times New Roman", serif;   /* big title, wordmark, book posters */
  --font-size-base: 17px;

  /* Shapes and widths */
  --radius-card: 14px;
  --radius-control: 10px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.05);
  --content-width: 1000px;   /* portal width */
  --reading-width: 760px;    /* width of the welcome, terms, survey and timetable screens */
}

/* =====================================================================
   BASE STYLES (you rarely need to edit below this line)
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
* { scroll-margin-top: var(--header-offset, 96px); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0; background: var(--color-page); color: var(--color-text);
  font-family: var(--font-body); font-size: var(--font-size-base); line-height: 1.55;
  overflow-wrap: break-word;
}
#app { min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--font-heading); line-height: 1.25; margin: 0 0 0.5rem; color: var(--color-text); }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.1rem); letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0 0 0.9rem; }
ul, ol { margin: 0 0 1rem; padding-left: 1.3rem; }
a { color: var(--color-primary); text-underline-offset: 3px; }
a:hover { color: var(--color-primary-hover); }
button, input, select { font: inherit; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.muted { color: var(--color-text-muted); }
.small { font-size: 0.9rem; }
.kicker { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 0.4rem; }
.lead { font-size: 1.08rem; }
.plain-list { list-style: none; padding: 0; margin: 0; }

/* Skip link (appears when you press Tab first) */
.skip-link {
  position: absolute; left: 12px; top: -200px; z-index: 100; padding: 10px 16px;
  background: var(--color-primary); color: var(--color-on-primary); border-radius: var(--radius-control); font-weight: 600;
}
.skip-link:focus { top: 12px; color: var(--color-on-primary); }

/* ---------- Top bar ---------- */
.concept-strip {
  margin: 0; padding: 5px 16px; text-align: center; font-size: 0.78rem; font-weight: 650; letter-spacing: 0.04em;
  background: var(--color-primary); color: var(--color-on-primary);
}
.site-header { position: sticky; top: 0; z-index: 20; background: var(--color-card); border-bottom: 1px solid var(--color-border); }
.topbar {
  max-width: var(--content-width); margin: 0 auto; padding: 10px 16px; min-height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { flex: none; display: block; width: 42px; height: 42px; }
.brand-mark svg { display: block; width: 100%; height: 100%; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.15; color: var(--color-primary); }
.brand-highlight { color: var(--color-title-accent); font-style: italic; font-weight: 400; }
.wordmark { flex: 0 1 auto; min-width: 0; text-align: right; line-height: 1.15; }   /* long words wrap instead of overlapping the logo */
.wordmark-name { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--color-primary); }
.wordmark-campus { display: block; margin-top: 2px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent); }
@media (max-width: 440px) {
  .brand-name { max-width: 7.5em; }
  .wordmark-name { font-size: 0.9rem; }
  .wordmark-campus { letter-spacing: 0.08em; }
}

/* ---------- Portal section menu (pills) ---------- */
.section-nav { border-top: 1px solid var(--color-border); }
.section-nav-list {
  position: relative; list-style: none; margin: 0 auto; max-width: var(--content-width); padding: 8px 16px;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin;
}
.section-nav-list li { flex: none; }
.pill {
  display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border-radius: var(--radius-pill);
  border: 1px solid var(--color-border); background: var(--color-card); color: var(--color-text);
  text-decoration: none; font-size: 0.92rem; font-weight: 550; white-space: nowrap;
}
.pill:hover { border-color: var(--color-primary); color: var(--color-primary); }
.pill[aria-current="page"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }

/* ---------- Page area ---------- */
.page { width: 100%; max-width: var(--content-width); margin: 0 auto; padding: 24px 16px 56px; flex: 1; }
.page-narrow { max-width: var(--reading-width); }
.card {
  background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-card);
  padding: 24px; box-shadow: var(--shadow-card);
}
.card + .card, .card + .notice, .notice + .card { margin-top: 16px; }
@media (max-width: 480px) { .card { padding: 18px 16px; } }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 22px;
  border-radius: var(--radius-pill); border: 1px solid transparent; font-weight: 650; font-size: 1rem; line-height: 1.25;
  text-align: center; text-decoration: none; cursor: pointer;
}
.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover { background: var(--color-primary-hover); color: var(--color-on-primary); }
.btn-primary:disabled { background: var(--color-disabled-bg); color: var(--color-disabled-text); cursor: not-allowed; }
.btn-secondary { background: var(--color-card); color: var(--color-primary); border-color: var(--color-border-strong); }
.btn-secondary:hover { border-color: var(--color-primary); background: var(--color-primary-soft); color: var(--color-primary); }
.btn-quiet {
  background: transparent; color: var(--color-text-muted); text-decoration: underline; text-underline-offset: 3px;
  padding: 8px 12px; min-height: 44px; font-weight: 500; font-size: 0.9rem;
}
.btn-quiet:hover { color: var(--color-text); }
.btn-large { min-height: 56px; padding: 14px 30px; font-size: 1.08rem; }
.btn-small { min-height: 44px; padding: 8px 16px; font-size: 0.92rem; }
.actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
.actions-start { justify-content: flex-start; }
.actions-end { justify-content: flex-end; }
@media (max-width: 540px) {
  .actions { flex-direction: column; align-items: stretch; }
  .actions .btn { width: 100%; }
}

/* ---------- Badges, chips and notices ---------- */
.badge {
  display: inline-flex; align-items: center; padding: 1px 10px; border-radius: var(--radius-pill); border: 1px solid transparent;
  font-size: 0.78rem; font-weight: 650; line-height: 1.7; white-space: nowrap; vertical-align: middle;
}
.badge-neutral { background: var(--color-primary-soft); color: var(--color-primary); }
.badge-recommended, .badge-success { background: var(--color-success-soft); color: var(--color-success); border-color: var(--color-success-border); }
.badge-tbc { background: var(--color-warning-soft); color: var(--color-warning); border: 1px dashed var(--color-warning-border); }
.badge-optional { background: var(--color-card); color: var(--color-text-muted); border-color: var(--color-border-strong); }
.badge-danger { background: var(--color-danger-soft); color: var(--color-danger); border-color: var(--color-danger-border); }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 12px 0 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 12px; border-radius: var(--radius-pill);
  background: var(--color-card); border: 1px solid var(--color-border); font-size: 0.9rem; font-weight: 600;
}
.chip-level { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
.chip-on::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-success); }
.notice { border: 1px solid; border-radius: 12px; padding: 14px 16px; margin: 0 0 16px; }
.notice p:last-child { margin-bottom: 0; }
.notice-info { background: var(--color-primary-soft); border-color: var(--color-primary-border); }
.notice-success { background: var(--color-success-soft); border-color: var(--color-success-border); }
.notice-warning { background: var(--color-warning-soft); border-color: var(--color-warning-border); }
.notice-error { background: var(--color-danger-soft); border-color: var(--color-danger-border); }
.form-error { color: var(--color-danger); font-weight: 600; margin: 12px 0 0; }
.form-error:empty { display: none; }

/* ---------- Step indicator ---------- */
.steps { margin: 0 0 20px; }
.steps-count { font-size: 0.9rem; font-weight: 600; color: var(--color-text-muted); margin: 0 0 8px; }
.steps-list { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.steps-item { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; color: var(--color-text-muted); min-width: 0; }
.steps-bar { height: 6px; border-radius: var(--radius-pill); background: var(--color-track); }
.steps-item.is-done .steps-bar { background: var(--color-primary); }
.steps-item.is-current .steps-bar { background: var(--color-accent); }
.steps-item.is-current { color: var(--color-text); font-weight: 650; }
@media (max-width: 560px) { .steps-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }

/* ---------- Welcome ---------- */
/* Faint grid behind the whole welcome page, fading out towards the edges */
#app.is-welcome {
  background-color: var(--color-page);
  background-image:
    radial-gradient(ellipse 75% 65% at 50% 35%, transparent 35%, var(--color-page) 100%),
    linear-gradient(to right, var(--color-grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--color-grid-line) 1px, transparent 1px);
  background-size: 100% 100%, 72px 72px, 72px 72px;
}
#app.is-welcome .steps { max-width: var(--reading-width); margin-left: auto; margin-right: auto; }
.welcome { text-align: center; padding: clamp(8px, 4vw, 36px) 0 8px; }
.welcome-kicker {
  display: inline-block; margin: 0 0 18px; padding: 5px 14px; border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-pill); background: var(--color-card); color: var(--color-text-muted);
  font-size: 0.74rem; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase;
}
.welcome-title {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(2.6rem, 1.5rem + 5vw, 4.5rem); line-height: 1.06;
  color: var(--color-primary); letter-spacing: -0.02em; margin: 0 auto 20px; max-width: 12em;
}
.title-word { display: inline-block; white-space: nowrap; }
/* The shimmer: each letter turns gold for a moment, one after another */
.title-letter {
  animation: title-wave var(--title-wave-duration) linear var(--title-wave-repeats);
  animation-delay: calc(var(--i, 0) * var(--title-wave-step));
}
.title-letter.is-highlight { animation: none; color: var(--color-title-accent); font-style: italic; }
@keyframes title-wave {
  0%, 78%, 100% { color: var(--color-primary); }
  86% { color: var(--color-title-accent); }
}
.welcome-intro { font-size: 1.12rem; max-width: 34rem; margin: 0 auto 26px; }
.welcome-points {
  list-style: none; padding: 0; margin: 16px auto 0; max-width: 40rem;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; font-size: 0.92rem; color: var(--color-text-muted);
}
.welcome-points li { display: inline-flex; align-items: center; gap: 8px; }
.welcome-points li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--color-title-accent); }
/* The pictures under the title (the middle one sits a little lower) */
.welcome-pictures { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 16px; align-items: start; margin: 48px 0 8px; }
.welcome-picture {
  margin: 0; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden; background: var(--color-primary);
  box-shadow: 0 12px 30px rgba(11, 46, 79, 0.14);
}
.welcome-picture:nth-child(even) { margin-top: 48px; }
.welcome-picture svg, .welcome-picture img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* A wide card (landscape photo) takes two columns and keeps the photo's own shape */
.welcome-pictures.has-wide { grid-auto-flow: row; grid-template-columns: repeat(var(--columns), 1fr); }
.welcome-picture.is-wide { grid-column: span 2; aspect-ratio: 16 / 9; }
@media (max-width: 540px) {
  .welcome-kicker { letter-spacing: 0.06em; font-size: 0.7rem; }
  .welcome-pictures { gap: 8px; margin-top: 32px; }
  .welcome-picture { border-radius: 10px; }
  .welcome-picture:nth-child(even) { margin-top: 20px; }
  /* Four or more pictures: two per row on phones */
  .welcome-pictures.is-many { grid-auto-flow: row; grid-template-columns: 1fr 1fr; gap: 10px; }
  /* Phones: the wide photo goes full width on top, the others share the row below */
  .welcome-pictures.has-wide { grid-template-columns: repeat(var(--narrow-columns), 1fr); }
  .welcome-picture.is-wide { grid-column: 1 / -1; margin-top: 0; }
}
/* Items fade up one after another when the page opens */
.rise {
  animation: rise var(--welcome-rise-duration) cubic-bezier(0.22, 0.61, 0.36, 1) both;
  animation-delay: calc(var(--order, 0) * var(--welcome-rise-step));
}
@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to { opacity: 1; transform: none; }
}

/* ---------- Terms ---------- */
.conduct-list { list-style: none; padding: 0; margin: 0 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.conduct-item { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px; background: var(--color-card-alt); }
.conduct-item strong { display: block; margin-bottom: 4px; }
.conduct-item p { margin: 0; font-size: 0.95rem; }
.rule { border-left: 4px solid var(--color-accent); background: var(--color-accent-soft); padding: 12px 16px; border-radius: 0 12px 12px 0; margin: 0 0 20px; }
.rule p { margin: 0; }
.check-row {
  display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid var(--color-border-strong);
  border-radius: 12px; background: var(--color-card); cursor: pointer; font-weight: 600;
}
.check-row input {
  -webkit-appearance: none; appearance: none; flex: none; width: 24px; height: 24px; margin: 0; cursor: pointer;
  border: 2px solid var(--color-border-strong); border-radius: 7px; background: var(--color-card); display: grid; place-content: center;
}
.check-row input::before {
  content: ""; width: 11px; height: 6px; margin-top: -3px; border-left: 2.5px solid var(--color-on-primary); border-bottom: 2.5px solid var(--color-on-primary);
  transform: rotate(-45deg) scale(0); transition: transform 0.12s ease;
}
.check-row input:checked { background: var(--color-primary); border-color: var(--color-primary); }
.check-row input:checked::before { transform: rotate(-45deg) scale(1); }
.check-row span { line-height: 1.45; }
.check-row.is-checked { border-color: var(--color-primary); background: var(--color-primary-soft); }

/* ---------- Survey ---------- */
.progress { margin: 4px 0 22px; }
.progress-text { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 6px; }
.progress-track { height: 10px; background: var(--color-track); border-radius: var(--radius-pill); overflow: hidden; }
.progress-fill { height: 100%; background: var(--color-primary); border-radius: var(--radius-pill); transition: width 0.25s ease; }
/* One statement and its four answers */
.question { border: 0; padding: 0; margin: 0 0 24px; min-width: 0; }
.question + .question { border-top: 1px solid var(--color-border); padding-top: 22px; }
/* float + width lets the legend sit inside the box like normal text (not on its border) */
.question-text { float: left; width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 0 0 14px; font-weight: 600; font-size: 1.04rem; line-height: 1.45; }
.question-text + * { clear: both; }
.question-number {
  flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--color-primary-soft); color: var(--color-primary); font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.question.is-missing .question-text { color: var(--color-danger); }
.question.is-missing .question-number { background: var(--color-danger-soft); color: var(--color-danger); }
.question.is-missing .scale-option { border-color: var(--color-danger-border); }

/* The 1 to 4 answer scale: a numbered circle and a label in each box */
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.scale-option {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px;
  min-height: 100px; padding: 16px 10px 14px; text-align: center; cursor: pointer;
  border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-card);
  transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
}
.scale-option:hover { border-color: var(--color-primary-border); background: var(--color-card-alt); }
.scale-input { position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: 0; opacity: 0; }
.scale-bubble {
  flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--color-border-strong); background: var(--color-card); color: var(--color-text-muted);
  font-size: 0.9rem; font-weight: 650; font-variant-numeric: tabular-nums;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.scale-label { font-size: 0.94rem; font-weight: 500; line-height: 1.3; color: var(--color-text); letter-spacing: 0; }
.scale-input:checked + .scale-bubble { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.scale-input:focus-visible + .scale-bubble { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.scale-option.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); box-shadow: inset 0 0 0 1px var(--color-primary); }
.scale-option.is-selected .scale-label { color: var(--color-primary); font-weight: 650; }
@media (max-width: 680px) {
  .scale { grid-template-columns: 1fr; gap: 8px; }
  .scale-option { flex-direction: row; min-height: 56px; padding: 10px 14px; gap: 14px; text-align: left; }
  .scale-bubble { width: 30px; height: 30px; font-size: 0.85rem; }
}

/* Radio boxes used in the timetable picker */
.choice {
  display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 14px; cursor: pointer;
  border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-card); line-height: 1.3;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}
.choice:hover { border-color: var(--color-primary-border); background: var(--color-card-alt); }
.choice input[type="radio"] {
  -webkit-appearance: none; appearance: none; flex: none; width: 20px; height: 20px; margin: 0; cursor: pointer;
  border: 2px solid var(--color-border-strong); border-radius: 50%; background: var(--color-card); display: grid; place-content: center;
}
.choice input[type="radio"]::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--color-primary); transform: scale(0); transition: transform 0.12s ease;
}
.choice input[type="radio"]:checked { border-color: var(--color-primary); }
.choice input[type="radio"]:checked::before { transform: scale(1); }
.choice.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); box-shadow: inset 0 0 0 1px var(--color-primary); }

/* Windows high-contrast mode: fall back to the browser's own controls */
@media (forced-colors: active) {
  .choice input[type="radio"], .check-row input { -webkit-appearance: auto; appearance: auto; }
  .choice input[type="radio"]::before, .check-row input::before { display: none; }
  .scale-input { opacity: 1; position: static; width: 18px; height: 18px; }
  .scale-bubble { display: none; }
}

/* ---------- Result ---------- */
.ladder { list-style: none; padding: 0; margin: 14px 0 16px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.ladder li {
  text-align: center; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--color-border);
  background: var(--color-card-alt); color: var(--color-text-muted); font-size: 0.9rem; font-weight: 600;
}
.ladder li.is-current { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0; }
.stat { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px; background: var(--color-card-alt); }
.stat-label { font-size: 0.88rem; color: var(--color-text-muted); margin: 0; }
.stat-value { font-size: 1.5rem; font-weight: 700; margin: 2px 0 0; color: var(--color-primary); font-variant-numeric: tabular-nums; }
.weak-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.weak-card { border: 1px solid var(--color-border); border-left: 4px solid var(--color-accent); border-radius: 12px; padding: 14px 16px; background: var(--color-card); }
.weak-name { font-weight: 650; margin: 0 0 4px; }
.weak-score { margin: 0 0 8px; color: var(--color-text-muted); font-size: 0.92rem; }
.meter { height: 8px; background: var(--color-track); border-radius: var(--radius-pill); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--color-primary); border-radius: var(--radius-pill); }
.details { margin-top: 16px; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-card); }
.details summary { cursor: pointer; padding: 12px 16px; min-height: 44px; font-weight: 600; color: var(--color-primary); }
.details[open] summary { border-bottom: 1px solid var(--color-border); }
.details-body { padding: 12px 16px 16px; }
.score-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.score-line { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; font-size: 0.95rem; }

/* ---------- Timetable picker ---------- */
.pref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin: 16px 0 20px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field select {
  width: 100%; min-height: 48px; padding: 10px 12px; color: var(--color-text); background-color: var(--color-card);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-control); font-variant-numeric: tabular-nums;
}
.day-block + .day-block { margin-top: 28px; }
.day-heading { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-bottom: 8px; border-bottom: 1px solid var(--color-border); }
.day-ideal { font-size: 0.9rem; font-weight: 500; color: var(--color-text-muted); }
.course-card { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px 16px; margin: 12px 0 0; background: var(--color-card-alt); min-width: 0; }
.course-card.has-clash { border-color: var(--color-danger); background: var(--color-danger-soft); }
.course-legend { font-weight: 650; padding: 0; font-size: 1.02rem; }
.course-meta { margin: 2px 0 12px; font-size: 0.92rem; color: var(--color-text-muted); }
.time-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 680px) { .time-options { grid-template-columns: 1fr; } }
.time-choice { flex-wrap: wrap; font-variant-numeric: tabular-nums; font-weight: 600; }
.clash-msg { color: var(--color-danger); font-weight: 600; margin: 10px 0 0; font-size: 0.95rem; }

/* ---------- Portal ---------- */
.portal-head { margin-bottom: 8px; }
.portal-section { margin-top: 36px; }
.section-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.day-col { background: var(--color-card-alt); border: 1px solid var(--color-border); border-radius: 12px; padding: 14px; }
.day-col h3 { margin-bottom: 4px; }
.class-block {
  background: var(--color-card); border: 1px solid var(--color-border); border-left: 4px solid var(--color-primary);
  border-radius: 10px; padding: 10px 12px; margin-top: 10px;
}
.class-block p { margin: 0; }
.class-time { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--color-primary); }
.class-name { font-weight: 650; }
.class-meta { font-size: 0.9rem; color: var(--color-text-muted); }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
@media (max-width: 400px) { .card-grid { grid-template-columns: 1fr; } }
.mini-card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-card); padding: 18px; box-shadow: var(--shadow-card); }
.mini-card h3 { margin-bottom: 8px; }
.mini-card p:last-child, .mini-card ul:last-child { margin-bottom: 0; }
.mini-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; margin-bottom: 8px; }
.mini-card-head h3 { margin: 0; }
.ai-tip { background: var(--color-primary-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
.ai-tip strong { display: block; color: var(--color-primary); }
.status-line { display: flex; gap: 8px; align-items: flex-start; font-size: 0.95rem; }
.status-line::before { content: ""; flex: none; width: 10px; height: 10px; margin-top: 0.45em; border-radius: 50%; background: var(--color-success); }
.row-list { list-style: none; padding: 0; margin: 0; }
.row-list li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--color-border); }
.row-list li:last-child { border-bottom: 0; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 14px; }
.video-box {
  aspect-ratio: 16 / 9; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: var(--color-primary-soft); border: 1px dashed var(--color-primary-border); color: var(--color-primary); text-align: center; padding: 12px; margin-bottom: 12px;
}
.video-play { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--color-primary); color: var(--color-on-primary); font-size: 1.2rem; }
.pdf-box {
  border-radius: 12px; border: 1px dashed var(--color-primary-border); background: var(--color-card-alt); padding: 16px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.pdf-icon {
  flex: none; width: 44px; height: 54px; border-radius: 6px; background: var(--color-accent); color: var(--color-on-primary);
  display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
}
.pdf-box p { margin: 0; }
.where-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.where-list li { padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-card-alt); }
.where-list a { font-weight: 650; }
.material-title { font-weight: 600; margin: 0; }
.material-meta { font-size: 0.9rem; color: var(--color-text-muted); margin: 0; }

/* Banners */
.banner { border-radius: 16px; padding: 22px; border: 1px solid var(--color-border); }
.banner-fees { background: var(--color-banner-fees); }
.banner-activities { background: var(--color-banner-activities); }
.banner-support { background: var(--color-banner-support); }
.banner > :last-child { margin-bottom: 0; }
.fee-table { width: 100%; border-collapse: collapse; background: var(--color-card); border-radius: 12px; overflow: hidden; margin: 0 0 14px; }
.fee-table th, .fee-table td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--color-border); vertical-align: top; }
.fee-table tr:last-child td { border-bottom: 0; }
.fee-table th { font-size: 0.85rem; color: var(--color-text-muted); background: var(--color-card-alt); }
.fee-amount { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fee-note { display: block; font-size: 0.88rem; color: var(--color-text-muted); }
.activity-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.activity-list li { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px; }
.activity-list p { margin: 4px 0 0; font-size: 0.95rem; }
.support-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.contact-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.contact-list li { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 12px; padding: 12px 14px; }
.contact-list p { margin: 2px 0 0; font-size: 0.95rem; }
.faq { background: var(--color-card); border: 1px solid var(--color-border); border-radius: 12px; }
.faq + .faq { margin-top: 8px; }
.faq summary { cursor: pointer; padding: 12px 14px; min-height: 44px; font-weight: 600; }
.faq p { padding: 0 14px 14px; margin: 0; }

/* Book of the week */
.book-layout { display: grid; grid-template-columns: minmax(180px, 240px) 1fr; gap: 24px; align-items: start; }
@media (max-width: 620px) { .book-layout { grid-template-columns: 1fr; } .poster { max-width: 260px; width: 100%; margin: 0 auto; } }
.poster {
  aspect-ratio: 3 / 4; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 8px 20px rgba(16, 24, 40, 0.16);
  background-image: radial-gradient(circle at 85% 12%, rgba(255, 255, 255, 0.16) 0 24%, transparent 25%),
                    linear-gradient(to top, rgba(0, 0, 0, 0.22), transparent 45%);
}
.poster-kicker { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; margin: 0; }
.poster-title { font-family: var(--font-display); font-size: 1.55rem; line-height: 1.15; font-weight: 700; margin: 0 0 8px; }
.poster-author { margin: 0; font-size: 0.95rem; }
.book-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
@media (max-width: 540px) { .book-controls .btn { flex: 1 1 100%; } }

/* How this portal runs */
.flow { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; align-items: center; }
.flow-box {
  width: min(100%, 440px); text-align: center; padding: 12px 16px; border-radius: 12px; font-weight: 650;
  background: var(--color-card); border: 1px solid var(--color-border-strong);
}
.flow-box small { display: block; font-weight: 400; color: var(--color-text-muted); font-size: 0.88rem; margin-top: 2px; }
.flow li:first-child .flow-box { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
.flow li:first-child .flow-box small { color: var(--color-on-primary); }
.flow-arrow { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 12px; font-size: 0.88rem; color: var(--color-text-muted); max-width: 440px; }
.flow-arrow span[aria-hidden] { font-size: 1.1rem; line-height: 1; color: var(--color-border-strong); }
.parts-list { list-style: none; padding: 0; margin: 0 0 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.parts-list li { border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px; background: var(--color-card-alt); }
.parts-list p { margin: 4px 0 0; font-size: 0.95rem; }

/* ---------- Portal pages: Home, banners, fees ---------- */
.portal-page > .section-title { font-size: clamp(1.6rem, 1.2rem + 1.5vw, 2.1rem); margin-bottom: 14px; }
.home-cards { margin-top: 22px; }
.mini-title { font-size: 1.05rem; margin: 0; }
.mini-card .mini-title + * { margin-top: 10px; }
.home-day { font-family: var(--font-display); font-size: 1.35rem; color: var(--color-primary); margin: 8px 0 6px; }
.card-actions { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.home-banners-title { margin: 36px 0 14px; font-size: 1.3rem; }
/* Home page photo banners: photo + navy shade + white text + one button */
.promo-list { display: grid; gap: 18px; }
.promo {
  position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: flex-end;
  min-height: 280px; border-radius: 20px; background: var(--color-primary); box-shadow: 0 14px 34px rgba(11, 46, 79, 0.16);
}
.promo-photo { position: absolute; left: 0; right: 0; top: -8%; z-index: -2; width: 100%; height: 116%; object-fit: cover; transform: scale(1.04); transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); }
.promo:hover .promo-photo { transform: scale(1.09); }
.promo-shade {
  position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgb(var(--banner-shade) / 0.95) 0%, rgb(var(--banner-shade) / 0.85) 45%, rgb(var(--banner-shade) / 0.2) 100%);
}
.promo-flip { justify-content: flex-end; }
.promo-flip .promo-shade { background: linear-gradient(270deg, rgb(var(--banner-shade) / 0.95) 0%, rgb(var(--banner-shade) / 0.85) 45%, rgb(var(--banner-shade) / 0.2) 100%); }
.promo-body { max-width: 560px; padding: clamp(24px, 4vw, 44px); color: #FFFFFF; }
.promo-kicker { margin: 0 0 6px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-banner-kicker); }
.promo-title { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 1.1rem + 2vw, 2.4rem); line-height: 1.1; color: #FFFFFF; }
.promo-text { margin: 0 0 20px; font-size: 1.04rem; color: rgba(255, 255, 255, 0.92); }
.promo-cta { background: #FFFFFF; color: var(--color-primary); }
.promo-cta:hover { background: var(--color-banner-kicker); color: var(--color-primary); transform: translateY(-1px); }
.promo-cta::after { content: ""; position: absolute; inset: 0; border-radius: 20px; }   /* makes the whole banner clickable */
.promo-cta:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 3px; }
/* Wider screens: the photo fills its own side of the banner and fades into
   solid navy behind the text, so the photo's subject is never hidden by words. */
@media (min-width: 641px) {
  .promo-photo { left: auto; right: 0; width: 66%; }
  .promo-flip .promo-photo { left: 0; right: auto; }
  .promo-shade { background: linear-gradient(90deg, rgb(var(--banner-shade)) 0%, rgb(var(--banner-shade)) 36%, rgb(var(--banner-shade) / 0.75) 46%, rgb(var(--banner-shade) / 0) 70%); }
  .promo-flip .promo-shade { background: linear-gradient(270deg, rgb(var(--banner-shade)) 0%, rgb(var(--banner-shade)) 36%, rgb(var(--banner-shade) / 0.75) 46%, rgb(var(--banner-shade) / 0) 70%); }
  .promo-body { max-width: min(560px, 44%); }
}
@media (max-width: 640px) {
  .promo { min-height: 340px; }
  .promo-shade, .promo-flip .promo-shade {
    background: linear-gradient(0deg, rgb(var(--banner-shade) / 0.96) 15%, rgb(var(--banner-shade) / 0.7) 60%, rgb(var(--banner-shade) / 0.25) 100%);
  }
}
/* Materials page */
.canvas-callout {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin: 4px 0 18px;
  padding: 20px 22px; border-radius: var(--radius-card); background: var(--color-primary-soft); border: 1px solid var(--color-primary-border);
}
.canvas-callout-text { flex: 1 1 320px; }
.canvas-callout p { margin: 6px 0 0; }
.material-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.material-card {
  display: flex; flex-direction: column; gap: 8px; padding: 18px; background: var(--color-card);
  border: 1px solid var(--color-border); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
}
.material-card .material-title { font-size: 1.05rem; margin: 2px 0 0; }
.material-desc { margin: 0; color: var(--color-text-muted); font-size: 0.95rem; flex: 1; }
.material-card .btn { align-self: flex-start; margin-top: 4px; }
/* Fees page */
.fee-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.fee-card { background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-card); padding: 20px; box-shadow: var(--shadow-card); }
.fee-item { margin: 0 0 6px; font-weight: 600; color: var(--color-text-muted); }
.fee-amount-big { margin: 0 0 10px; font-family: var(--font-display); font-size: 2rem; line-height: 1.1; color: var(--color-primary); font-variant-numeric: tabular-nums; }
.fee-card .fee-note { margin: 10px 0 0; display: block; }

/* ---------- Sign-in bar ---------- */
.account-bar { background: var(--color-primary-soft); border-bottom: 1px solid var(--color-primary-border); }
.account-inner { max-width: var(--content-width); margin: 0 auto; padding: 12px 16px; }
.account-bar.is-signed-in .account-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 8px 16px; }
.account-who { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 0.95rem; }
.account-email { color: var(--color-text-muted); font-size: 0.88rem; }
.login-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.login-title { margin: 0 0 8px; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
.login-title-narrow, .login-toggle { display: none; }
.login-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 12px; }
.login-field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 210px; min-width: 0; }
.login-field label { font-size: 0.82rem; font-weight: 650; color: var(--color-text-muted); }
.login-field input {
  width: 100%; min-height: 44px; padding: 8px 12px; color: var(--color-text); background: var(--color-card);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-control); font: inherit;
}
.login-submit { min-height: 44px; padding: 8px 22px; }
.login-hint { margin: 8px 0 0; font-size: 0.85rem; color: var(--color-text-muted); }
.account-bar .form-error { margin: 8px 0 0; }
.role-switch {
  margin: 0; padding: 3px; display: inline-flex; flex: none; gap: 2px;
  background: var(--color-card); border: 1px solid var(--color-border-strong); border-radius: var(--radius-pill);
}
.role-switch label { position: relative; }
.role-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.role-switch span {
  display: inline-flex; align-items: center; min-height: 38px; padding: 6px 16px; border-radius: var(--radius-pill);
  font-size: 0.9rem; font-weight: 650; color: var(--color-text-muted); cursor: pointer;
}
.role-switch input:checked + span { background: var(--color-primary); color: var(--color-on-primary); }
.role-switch input:focus-visible + span { outline: 3px solid var(--color-focus); outline-offset: 2px; }
[aria-invalid="true"] { border-color: var(--color-danger) !important; box-shadow: 0 0 0 1px var(--color-danger); }
@media (max-width: 760px) {
  .login-title { margin: 0; }
  .login-title-wide { display: none; }
  .login-title-narrow { display: inline; font-weight: 600; font-size: 0.9rem; }
  .login-toggle { display: inline-flex; }

   =====================================================================
   PART 2: THE ENGINE (how the site works)
   ---------------------------------------------------------------------
   Everything below builds the page from the blocks above.
   You do not need to change anything here to edit content.
   Sections:  1 helpers · 2 saving · 3 settings checks · 4 scoring
              5 timetable maths · 6 page frame · 7 journey screens
              8 portal sections · 9 start-up

/* ---------- 1. Helpers ---------- */

// Fills {placeholders} in a text: fill("Hi {name}", { name: "Sara" }) gives "Hi Sara".
function fill(text, values) {
  return String(text === undefined || text === null ? "" : text).replace(/\{(\w+)\}/g, function (match, key) {
    return values && values[key] !== undefined && values[key] !== null ? String(values[key]) : match;
  });
}

// Creates a page element: h("p", { class: "note" }, "Hello") gives <p class="note">Hello</p>.
// Text is always added as plain text, so quotes or < > in your content are safe.
function h(tag, attributes) {
  const node = document.createElement(tag);
  const attrs = attributes || {};
  Object.keys(attrs).forEach(function (name) {
    const value = attrs[name];
    if (value === null || value === undefined || value === false) return;
    if (/^on[A-Z]/.test(name)) node.addEventListener(name.slice(2).toLowerCase(), value);
    else if (name === "class") node.className = value;
    else if (value === true) node.setAttribute(name, "");
    else node.setAttribute(name, String(value));
  });
  addChildren(node, Array.prototype.slice.call(arguments, 2));
  return node;
}
function addChildren(node, children) {
  children.forEach(function (child) {
    if (Array.isArray(child)) addChildren(node, child);
    else if (child === null || child === undefined || child === false || child === "") return;
    else node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  });
}

function badge(text, kind) { return h("span", { class: "badge badge-" + (kind || "neutral") }, text); }
function tbcBadge(text) { return badge(text || TEXT.tbcBadge, "tbc"); }

// Times: "09:40" <-> 580 minutes after midnight.
function isTime(value) { return /^([01]?\d|2[0-3]):[0-5]\d$/.test(String(value)); }
function toMinutes(time) { const parts = String(time).split(":"); return Number(parts[0]) * 60 + Number(parts[1]); }
function toTime(minutes) { return String(Math.floor(minutes / 60)).padStart(2, "0") + ":" + String(minutes % 60).padStart(2, "0"); }
function timeRange(start, end) { return fill(TEXT.timeRange, { start: toTime(start), end: toTime(end) }); }

function joinWords(words) {
  if (words.length <= 1) return words.join("");
  return words.slice(0, -1).join(", ") + " " + TEXT.and + " " + words[words.length - 1];
}
function findById(list, id) { return list.find(function (item) { return item.id === id; }) || null; }
function safeId(text) { return String(text).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
function dayName(day) { return TIMETABLE.classDays[Number(day) - 1] || String(day); }
function prefersReducedMotion() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
function sortedLevels() { return LEVELS.slice().sort(function (a, b) { return a.minAverage - b.minAverage; }); }
function includesLevel(entry, levelId) { return Array.isArray(entry.levels) && entry.levels.indexOf(levelId) !== -1; }

function weeksSinceStart() {
  const start = new Date(SITE.programmeStartDate + "T00:00:00");
  if (isNaN(start.getTime())) return 0;
  const diff = Date.now() - start.getTime();
  return diff > 0 ? Math.floor(diff / (7 * 24 * 60 * 60 * 1000)) : 0;
}


/* ---------- 2. Saving progress in the browser (localStorage) ----------
   Wrapped in try/catch so the site still works if the browser blocks
   storage (some private windows do). Progress then lives in memory only. */
const storage = (function () {
  let available = false;
  let memoryCopy = null;
  try {
    const testKey = SITE.storageName + "-test";
    window.localStorage.setItem(testKey, "1");
    window.localStorage.removeItem(testKey);
    available = true;
  } catch (error) {
    available = false;
  }
  return {
    available: available,
    load: function () {
      if (available) {
        try {
          const raw = window.localStorage.getItem(SITE.storageName);
          return raw ? JSON.parse(raw) : null;
        } catch (error) { /* fall back to the memory copy */ }
      }
      return memoryCopy ? JSON.parse(JSON.stringify(memoryCopy)) : null;
    },
    save: function (data) {
      memoryCopy = JSON.parse(JSON.stringify(data));
      if (available) {
        try { window.localStorage.setItem(SITE.storageName, JSON.stringify(data)); } catch (error) { /* keep the memory copy */ }
      }
    },
    clear: function () {
      memoryCopy = null;
      if (available) {
        try { window.localStorage.removeItem(SITE.storageName); } catch (error) { /* nothing to clear */ }
      }
    },
  };
})();

const SCREENS = ["welcome", "terms", "survey", "result", "picker", "portal"];
const JOURNEY_STEP = { welcome: 0, terms: 1, survey: 2, result: 3, picker: 4 };

let db;      // everything saved on this device: sign-in, accounts, every student's progress, assignments
let state;   // the signed-in student's progress (answers, group, timetable); part of db
let ui;      // things we do not save: which book is showing, messages

function freshDb() {
  return {
    version: 2,
    logins: {},             // student accounts: { email: { hash, createdAt } }
    students: {},           // each student's progress: { email: state }
    assignments: [],        // assignments professors created on this device
    assignmentReview: {},   // professor publish/unpublish choices for assignments in THIS_WEEK
    activity: [],           // recent events shown live to professors (sign-ins, surveys finished...)
    chats: {},              // each professor's conversation with their assistant
    console: {},            // AI console settings, e.g. { margin: 2.5 }
  };
}
function loadDb() {
  const saved = storage.load();
  const d = freshDb();
  if (saved && typeof saved === "object" && saved.version === 2) Object.assign(d, saved);
  if (!d.logins || typeof d.logins !== "object") d.logins = {};
  if (!d.students || typeof d.students !== "object") d.students = {};
  if (!Array.isArray(d.assignments)) d.assignments = [];
  if (!d.assignmentReview || typeof d.assignmentReview !== "object") d.assignmentReview = {};
  if (!Array.isArray(d.activity)) d.activity = [];
  if (!d.chats || typeof d.chats !== "object") d.chats = {};
  if (!d.console || typeof d.console !== "object") d.console = {};
  delete d.session;
  return d;
}

/* Who is signed in is kept per browser tab (sessionStorage), so a student
   and a professor can be signed in at the same time in two tabs and watch
   each other's changes appear. If the visitor accepted cookies, the sign-in
   is also remembered for their next visit. */
let session = null;   // { role: "student" | "professor", email, professorId }
function storageKey(name) { return SITE.storageName + "-" + name; }
function readJson(area, key) {
  try { const raw = window[area].getItem(key); return raw ? JSON.parse(raw) : null; } catch (error) { return null; }
}
function writeJson(area, key, value) {
  try {
    if (value === null || value === undefined) window[area].removeItem(key);
    else window[area].setItem(key, JSON.stringify(value));
  } catch (error) { /* storage blocked: keep it in memory only */ }
}
let consentMemory = null;   // used when the browser blocks storage
function loadConsent() { return readJson("localStorage", storageKey("consent")) || consentMemory; }
function saveConsent(remember) {
  consentMemory = { remember: !!remember, at: new Date().toISOString() };
  writeJson("localStorage", storageKey("consent"), consentMemory);
  try { document.cookie = "ssic_consent=" + (remember ? "all" : "essential") + "; max-age=31536000; path=/; SameSite=Lax"; } catch (error) { /* cookies blocked */ }
  saveSession();
}
function loadSession() {
  let s = readJson("sessionStorage", storageKey("session"));
  const consent = loadConsent();
  if (!s && consent && consent.remember) s = readJson("localStorage", storageKey("remember"));
  if (!s || typeof s !== "object") return null;
  if (s.role === "professor" && (cloudMode || !findById(PROFESSORS, s.professorId))) return null;
  if (s.role === "student" && !db.logins[s.email]) return null;
  return s;
}
function saveSession() {
  if (online.on) {
    // Online, students come back through their Claude account; only a professor choice is kept for this tab.
    writeJson("sessionStorage", storageKey("online-session"), isProfessor() ? { role: "professor", professorId: session.professorId } : null);
    return;
  }
  writeJson("sessionStorage", storageKey("session"), session);
  const consent = loadConsent();
  writeJson("localStorage", storageKey("remember"), consent && consent.remember ? session : null);
}
// Adds an event to the live activity feed that professors see.
function logActivity(type, email, detail) {
  db.activity.unshift({ type: type, email: email, detail: detail || "", at: new Date().toISOString() });
  db.activity = db.activity.slice(0, 40);
}
function isStudent() { return !!(session && session.role === "student"); }
function isProfessor() { return !!(session && session.role === "professor"); }
function currentProfessor() { return isProfessor() ? findById(PROFESSORS, session.professorId) : null; }
// Which screen to show: professors see the staff console; signed-out visitors see the welcome page.
function currentScreen() {
  if (isProfessor()) return "staff";
  if (!isStudent()) return "welcome";
  return state.screen;
}
// "ibz4000@university.ac.uk" becomes "ibz4000" (the student's username).
function nameFromEmail(email) { return String(email).split("@")[0]; }
// Scrambles a password before it is saved, so it is not stored as plain text.
// (A demo measure only: a real site checks passwords on a secure server.)
function scramble(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
  return (hash >>> 0).toString(16);
}

function freshState() {
  return {
    screen: "welcome",
    termsAccepted: false,
    surveyIndex: 0,
    answers: {},                                        // { skillId: [score, score, score] }
    draft: { prefs: {}, picks: {}, stage: "prefs" },    // timetable being chosen
    timetable: null,                                    // confirmed: { prefs, picks, confirmedAt }
    remindersOn: false,
    attendanceOn: false,
  };
}
function freshUi() { return { justConfirmed: false, pickerError: false, bookOffset: 0, navLockUntil: 0 }; }

// Tidies one student's saved progress and decides which screen they return to.
function loadStudentState(saved) {
  const s = freshState();
  if (saved && typeof saved === "object") Object.assign(s, saved);
  if (!s.answers || typeof s.answers !== "object") s.answers = {};
  if (!s.draft || typeof s.draft !== "object") s.draft = freshState().draft;
  s.draft.prefs = s.draft.prefs || {};
  s.draft.picks = s.draft.picks || {};
  s.surveyIndex = Math.min(Math.max(0, Number(s.surveyIndex) || 0), Math.max(0, SURVEY_SKILLS.length - 1));
  if (SCREENS.indexOf(s.screen) === -1) s.screen = "welcome";

  // Returning students who confirmed a timetable go straight to their portal.
  if (s.timetable) { s.screen = "portal"; return s; }
  if (s.screen === "portal") s.screen = "picker";
  if (!s.termsAccepted && SCREENS.indexOf(s.screen) > SCREENS.indexOf("terms")) s.screen = "terms";
  // If survey statements were added since the last visit, ask the student to answer them.
  const gap = firstUnansweredSkill(s.answers);
  if ((s.screen === "result" || s.screen === "picker") && gap !== -1) { s.screen = "survey"; s.surveyIndex = gap; }
  return s;
}
function save() {
  if (isStudent()) db.students[session.email] = state;
  if (online.on) saveOnline();     // published on claude.ai: save to the shared database
  else storage.save(db);           // otherwise: save in this browser
  saveSession();
}


/* ---------- 2b. Saving online (when the site is published on claude.ai) ----------
   Opened from the downloaded file, the site saves in this browser only (above).
   Published as a claude.ai page with its shared database switched on, it
   saves to that database instead:
   - each student's progress is stored under their Claude account, so it is
     there every time they sign in, on any device;
   - the page owner can open the professor pages and sees every student's
     real results as they come in; students cannot read each other's records;
   - there are no passwords: the Claude sign-in already says who is who.
   Database layout (rules are set when the page is published):
     students/<account id>     one record per student: username, progress, recent events
     shared/site               assignments, console settings and staff events (owner writes)
     data/users/<id>/chats     each professor's assistant conversation (private) */
const hosted = !!(window.claude && typeof window.claude.use === "function");   // opened inside claude.ai
const online = {
  on: false,          // true once the shared database is in use
  status: "off",      // "off" | "connecting" | "live" | "slow" | "problem" | "readonly" | "full"
  base: null,         // the shared database
  uid: null,          // this person's Claude account id (never shown)
  isOwner: false,     // the page owner may open the professor pages
  docs: {},           // student records the database sent: { accountId: record }
  keyByUid: {},       // accountId -> the name used for that student on the professor pages
  staffEvents: [],    // professor events from shared/site
  writes: {},         // one write at a time for each record
  changedAt: "",      // when this tab last changed the signed-in student's progress
  username: "",       // what the signed-in student typed
  greeted: false,     // the first answer from the database has arrived
};
function startOnline() {
  if (webMode) { startWeb(); return; }
  if (!hosted) return;
  online.status = "connecting";
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (found) {
    const base = found[0], who = found[1];
    if (!base || !who) return null;
    return Promise.all([who.id(), who.isOwner()]).then(function (facts) {
      if (facts[0]) goOnline(base, facts[0], !!facts[1]);
      return facts[0];
    });
  }).catch(function () { return null; }).then(function (uid) {
    if (uid) return;
    // No shared database here (for example a visitor who is not signed in to Claude):
    // the site still works and saves in this browser only.
    online.status = "off";
    if (!online.on) render({ keepFocusScroll: true, focusId: document.activeElement && document.activeElement.id });
  });
}
function goOnline(base, uid, isOwner) {
  online.on = true;
  online.base = base;
  online.uid = uid;
  online.isOwner = isOwner;
  online.status = "connecting";
  // The online site starts clean: accounts saved in this browser are not part of it.
  db = freshDb();
  session = null;
  const saved = readJson("sessionStorage", storageKey("online-session"));
  if (saved && saved.role === "professor" && isOwner && findById(PROFESSORS, saved.professorId)) {
    session = { role: "professor", email: findById(PROFESSORS, saved.professorId).name, professorId: saved.professorId };
  }
  state = freshState();
  ui = freshUi();
  render({ scrollTop: true });

  // If the database has not answered after 10 seconds, say so (it keeps trying).
  const timer = window.setTimeout(function () {
    if (online.status === "connecting") { online.status = "slow"; showOnlineStatus(); }
    if (!online.greeted) { online.greeted = true; if (!session) render({ keepFocusScroll: true }); }
  }, 10000);
  function answered(snap) {
    if (snap.metadata && snap.metadata.fromCache) return;
    window.clearTimeout(timer);
    if (online.status === "connecting" || online.status === "slow") { online.status = "live"; showOnlineStatus(); }
  }
  base.doc("shared/site").onSnapshot(function (snap) {
    applySharedSite(snap.exists ? snap.data() : null);
    answered(snap);
  }, onlineFailed);
  const students = isOwner ? base.collection("students") : base.doc("students/" + uid);
  students.onSnapshot(function (snap) {
    applyStudentRecords(isOwner ? snap.docs : (snap.exists ? [snap] : []), snap.metadata || {});
    answered(snap);
  }, onlineFailed);
  if (isOwner) {
    base.doc("data/users/" + uid + "/chats").onSnapshot(function (snap) {
      const body = snap.exists ? snap.data() : null;
      if (!body || !body.chats || typeof body.chats !== "object") return;
      noteReceived("data/users/" + uid + "/chats", { chats: body.chats });

  });

  online.docs = next;
  db.students = {};

    if (db.logins[key]) { let n = 2; while (db.logins[key + " (" + n + ")"]) n++; key = key + " (" + n + ")"; }
    online.keyByUid[id] = key;
    db.logins[key] = { createdAt: record.createdAt || "", online: true };
    db.students[key] = record.state && typeof record.state === "object" ? JSON.parse(JSON.stringify(record.state)) : {};
  });

  const mine = next[online.uid];
  if (mine) noteReceived("students/" + online.uid, studentRecordContent(mine));
  if (!online.greeted && !mine && metadata.fromCache) return;   // wait for the database's real answer
  const firstAnswer = !online.greeted;
  online.greeted = true;

  // On the website, signing in does the same (and a first sign-in creates the record).
  const signedOutHere = hosted && readJson("sessionStorage", storageKey("online-signed-out"));
  const autoName = mine ? mine.username : (webMode ? online.email : "");
  if (!session && autoName && !signedOutHere) {
    online.username = autoName;
    session = { role: "student", email: online.keyByUid[online.uid] || String(autoName).toLowerCase() };
    state = loadStudentState(mine ? mine.state : null);
    ui = freshUi();
    const event = online.pendingEvent;
    online.pendingEvent = null;
    ui.signInNotice = fill(event === "account" ? TEXT.web.createdNotice : TEXT.login.welcomeBackNotice, { name: nameFromEmail(session.email) });

    render({ focusId: state.screen === "welcome" ? "welcome-start" : "screen-heading", scrollTop: true });
    return;
  }
  if (isStudent()) {
    session.email = online.keyByUid[online.uid] || session.email;
    // A change made on another device: show it, unless this tab has newer changes.
    if (mine && !pendingWrite("students/" + online.uid) && !metadata.hasPendingWrites &&
        String(mine.updatedAt || "") > online.changedAt &&
        stableJson(mine.state || {}) !== stableJson(state)) {
      state = loadStudentState(mine.state);
      refreshAfterRemoteChange();
      return;
    }

}
function rebuildActivity() {
  const events = [];
  Object.keys(online.docs).forEach(function (id) {
    const record = online.docs[id];
    (Array.isArray(record.events) ? record.events : []).forEach(function (e) {
      if (e && e.type && e.at) events.push({ type: String(e.type), email: online.keyByUid[id] || "", detail: String(e.detail || ""), at: String(e.at) });
    });

  online.staffEvents.forEach(function (e) {

// What is stored for a student (without the time stamp, which is added when writing).
function studentRecordContent(record) {

// Called by save(): writes only the records that really changed.
function saveOnline() {

// JSON text with keys in a fixed order, so two copies of the same data always match.
function stableJson(value) {
  if (Array.isArray(value)) return "[" + value.map(stableJson).join(",") + "]";
  if (value && typeof value === "object") {
    return "{" + Object.keys(value).sort().filter(function (k) { return value[k] !== undefined; })
      .map(function (k) { return JSON.stringify(k) + ":" + stableJson(value[k]); }).join(",") + "}";
  }
  return JSON.stringify(value === undefined ? null : value);
}
function writeSlot(path) {

function noteReceived(path, content) {

}
// One write at a time per record; a newer change waits for the one before it.
// Returns true when something will be written.
function queueWrite(path, content) {
  const w = writeSlot(path);
  const json = stableJson(content);
  if (json === (w.next ? w.nextJson : w.lastJson)) return false;
  w.next = content;
  w.nextJson = json;

}

    w.busy = false;
    w.retried = false;
    w.lastJson = json;

    flushWrite(path);
  }, function (error) {
    w.busy = false;
    const code = error && error.code;
    if (code === "unavailable" && !w.retried) {
      // A short hiccup: try once more after a moment.
      w.retried = true;

      window.setTimeout(function () { flushWrite(path); }, 1200 + Math.random() * 1200);
      return;
    }
    w.retried = false;

}

/* ---------- 2c. Saving online on your own website (Supabase) ----------
   Used only in the website version, when ONLINE_DATABASE (top of PART 1)
   holds your Supabase address and public key. Students sign in with an
   email and a password made just for this site; Supabase keeps the
   passwords safely (the site never sees or stores them). This part gives
   the online saving code above the same kind of database it uses inside
   claude.ai, so both behave the same way.
   Tables (made by supabase-setup.sql):
     students     one row per student: username, progress, recent events
     site         assignments and console settings (professors write)
     staff        the professors' emails (who may open the professor pages)
     staff_chats  each professor's assistant conversation */
let webMode = false;     // true in the website version with ONLINE_DATABASE filled in
let cloudMode = hosted;  // true when saving online (claude.ai or the website)
function supabaseBase(client) {
  const TABLES = {
    students: { table: "students", key: "user_id" },
    site: { table: "site", key: "id" },
    chats: { table: "staff_chats", key: "user_id" },
  };
  function where(path) {
    const s = path.split("/");
    if (s[0] === "students") return { t: TABLES.students, id: s[1] };
    if (s[0] === "shared") return { t: TABLES.site, id: s[1] };
    if (s[0] === "data" && s[3] === "chats") return { t: TABLES.chats, id: s[2] };
    throw new TypeError("No table for " + path);
  }
  function iso(value) { const d = new Date(value); return isNaN(d.getTime()) ? "" : d.toISOString(); }
  function toRow(w, body) {
    if (w.t === TABLES.students) {
      return { user_id: w.id, username: body.username, created_at: body.createdAt || new Date().toISOString(),
        updated_at: body.updatedAt, state: body.state || {}, events: body.events || [] };
    }
    if (w.t === TABLES.site) return { id: w.id, data: body, updated_at: body.updatedAt };
    return { user_id: w.id, chats: body.chats || {} };
  }
  function fromRow(w, row) {
    if (w.t === TABLES.students) {
      return { username: row.username, createdAt: iso(row.created_at), updatedAt: iso(row.updated_at), state: row.state || {}, events: row.events || [] };
    }
    if (w.t === TABLES.site) return row.data || {};
    return { chats: row.chats || {} };
  }
  // Turns a Supabase error into one of the codes the saving code understands.
  function failure(error) {
    const code = String((error && error.code) || "");
    const status = error && error.status;
    const message = (error && error.message) || "";
    if (code === "42501" || status === 401 || status === 403) return { code: "invalid_argument", message: message };
    if (code === "42P01" || /^PGRST20[2-5]$/.test(code)) return { code: "setup", message: message };
    return { code: "unavailable", message: message };
  }
  function snapshot(id, body) {
    return { id: id, exists: !!body, data: function () { return body ? JSON.parse(JSON.stringify(body)) : undefined; },
      metadata: { fromCache: false, hasPendingWrites: false } };
  }
  // Reads again whenever the table changes (live updates), and every 30 seconds
  // as a back-up in case live updates are switched off in Supabase.
  function watch(table, filter, read) {
    let timer = null;
    const soon = function () { window.clearTimeout(timer); timer = window.setTimeout(read, 250); };
    const options = { event: "*", schema: "public", table: table };
    if (filter) options.filter = filter;
    let channel = null;
    try {
      channel = client.channel("ssic-" + table + "-" + Math.random().toString(36).slice(2)).on("postgres_changes", options, soon).subscribe();
    } catch (error) { channel = null; }
    const poll = window.setInterval(function () { if (!document.hidden) read(); }, 30000);
    read();
    return function () {
      window.clearInterval(poll);
      window.clearTimeout(timer);
      if (channel) { try { client.removeChannel(channel); } catch (error) { /* already closed */ } }
    };
  }
  function listen(table, filter, query, deliver, fail) {
    let stopped = false;
    let stop = function () {};
    stop = watch(table, filter, function () {
      query().then(function (result) {
        if (stopped) return;
        if (result.error) {
          const f = failure(result.error);
          if (f.code === "unavailable") return;   // a hiccup: the next read tries again
          stopped = true;
          stop();
          if (fail) fail(f);
          return;
        }
        deliver(result.data);
      }, function () { /* offline: the next read tries again */ });
    });
    return function () { stopped = true; stop(); };
  }
  function doc(path) {
    const w = where(path);
    return {
      path: path,
      set: function (body) {
        return client.from(w.t.table).upsert(toRow(w, body)).then(function (result) {
          if (result.error) throw failure(result.error);
        }, function (error) { throw { code: "unavailable", message: String(error && error.message || error) }; });
      },
      onSnapshot: function (next, fail) {
        return listen(w.t.table, w.t.key + "=eq." + w.id,
          function () { return client.from(w.t.table).select("*").eq(w.t.key, w.id).maybeSingle(); },
          function (row) { next(snapshot(w.id, row ? fromRow(w, row) : null)); }, fail);
      },
    };
  }
  function collection(path) {
    const w = where(path + "/all");
    return {
      path: path,
      onSnapshot: function (next, fail) {
        return listen(w.t.table, null,
          function () { return client.from(w.t.table).select("*"); },
          function (rows) {
            const docs = (rows || []).map(function (row) { return snapshot(row[w.t.key], fromRow(w, row)); });
            next({ docs: docs, size: docs.length, empty: !docs.length, metadata: { fromCache: false, hasPendingWrites: false } });
          }, fail);
      },
    };
  }
  return { doc: doc, collection: collection };
}
// Website version: connect to Supabase and, if this browser is already signed in, carry on.
function startWeb() {

  const consent = loadConsent();

// Sign in, or create the account the first time (like the downloaded version).
function handleWebSignIn() {
  const ww = TEXT.web;
  const emailBox = document.getElementById("login-email");
  const passwordBox = document.getElementById("login-password");
  const errorBox = document.getElementById("login-error");
  const button = document.getElementById("login-submit");
  const email = emailBox.value.trim().toLowerCase();
  const password = passwordBox.value;
  const min = Number(LOGIN.minimumPasswordLength) || 8;
  emailBox.removeAttribute("aria-invalid");
  passwordBox.removeAttribute("aria-invalid");
  errorBox.textContent = "";
  function busy(on) { button.disabled = on; button.textContent = on ? ww.busyButton : ww.signInButton; }
  function fail(message, box) {
    busy(false);
    errorBox.textContent = message;
    if (box) { box.setAttribute("aria-invalid", "true"); box.focus(); }
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fail(ww.errorEmail, emailBox); return; }
  if (password.length < min) { fail(fill(ww.errorPasswordShort, { count: min }), passwordBox); return; }
  if (!online.client) { fail(ww.configNotice); return; }
  busy(true);
  const auth = online.client.auth;
  auth.signInWithPassword({ email: email, password: password }).then(function (result) {
    if (!result.error && result.data && result.data.session) return enterWeb(result.data.session.user, "signin");
    const error = result.error || {};
    const code = String(error.code || "");
    const message = String(error.message || "").toLowerCase();
    if (code === "email_not_confirmed" || message.indexOf("not confirmed") !== -1) { fail(ww.errorConfirm); return; }
    if (code !== "invalid_credentials" && message.indexOf("invalid login") === -1) { fail(ww.errorNetwork); return; }
    // No account with this email and password yet: create one.
    return auth.signUp({ email: email, password: password }).then(function (made) {
      if (made.error) {
        const c = String(made.error.code || "");
        const m = String(made.error.message || "").toLowerCase();
        if (c === "user_already_exists" || m.indexOf("already registered") !== -1) { fail(ww.errorWrongPassword, passwordBox); return; }
        if (c === "weak_password" || m.indexOf("password") !== -1) { fail(fill(ww.errorWeakPassword, { count: min }), passwordBox); return; }
        if (c === "signup_disabled") { fail(ww.errorSignupOff); return; }
        fail(ww.errorNetwork);
        return;
      }
      if (!made.data || !made.data.session) { fail(ww.errorConfirm); return; }
      return enterWeb(made.data.session.user, "account");
    });
  }).catch(function () { fail(ww.errorNetwork); });
}


/* ---------- 3. Settings checks ----------
   Runs once when the page opens and prints warnings in the browser
