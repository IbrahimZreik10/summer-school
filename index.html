   wrong, including any class outside the allowed day start and end. */
function checkConfig() {
  const warnings = [];
  const warn = function (message) { if (warnings.indexOf(message) === -1) warnings.push(message); };
  const dayStart = toMinutes(TIMETABLE.dayStart);
  const dayEnd = toMinutes(TIMETABLE.dayEnd);
  const dayCount = TIMETABLE.classDays.length;
  const levelIds = LEVELS.map(function (l) { return l.id; });
  const skillIds = SURVEY_SKILLS.map(function (s) { return s.id; });

  if (!isTime(TIMETABLE.dayStart) || !isTime(TIMETABLE.dayEnd)) warn("TIMETABLE.dayStart and dayEnd must be times like \"09:40\".");
  if (!isTime(TIMETABLE.defaultPreferredStart)) warn("TIMETABLE.defaultPreferredStart must be a time like \"09:40\".");

  // Checks one item's time(s) against the allowed window.
  function checkWindow(kind, label, times, length) {
    times.forEach(function (t) {
      if (!isTime(t)) { warn(kind + " \"" + label + "\": \"" + t + "\" is not a time like \"09:40\"."); return; }
      const start = toMinutes(t);
      const end = start + length;
      if (start < dayStart || end > dayEnd) {
        warn(kind + " \"" + label + "\" runs " + toTime(start) + "–" + toTime(end) + ", outside the allowed " +
          TIMETABLE.dayStart + "–" + TIMETABLE.dayEnd + " window.");
      }
    });
  }
  function checkDay(kind, label, day) {
    if (!(Number(day) >= 1 && Number(day) <= dayCount)) warn(kind + " \"" + label + "\" has day: " + day + ", but there are only " + dayCount + " class days.");
  }

  const seenCourseIds = {};
  COURSES.forEach(function (c) {
    const label = c.name || c.id;
    if (seenCourseIds[c.id]) warn("Two courses share the id \"" + c.id + "\". Each course needs its own id.");
    seenCourseIds[c.id] = true;
    if (levelIds.indexOf(c.level) === -1) warn("Course \"" + label + "\" has level \"" + c.level + "\", which is not in LEVELS.");
    if (!findById(PROFESSORS, c.professor)) warn("Course \"" + label + "\" has professor \"" + c.professor + "\", which is not in PROFESSORS.");
    checkDay("Course", label, c.day);
    if (!Array.isArray(c.times) || c.times.length === 0) { warn("Course \"" + label + "\" has no times."); return; }
    if (c.times.length !== 3) warn("Course \"" + label + "\" has " + c.times.length + " time options. The plan is three per course.");
    checkWindow("Course", label, c.times, classLength(c));
  });

  // A professor cannot teach two classes at once.
  PROFESSORS.forEach(function (prof) {
    const sessions = [];
    usableCourses(COURSES.filter(function (c) { return c.professor === prof.id; })).forEach(function (c) {
      c.times.forEach(function (t, i) { sessions.push({ course: c, slot: slotFor(c, i) }); });
    });
    for (let a = 0; a < sessions.length; a++) {
      for (let b = a + 1; b < sessions.length; b++) {
        const x = sessions[a], y = sessions[b];
        if (x.course !== y.course && Number(x.course.day) === Number(y.course.day) && x.slot.start < y.slot.end && y.slot.start < x.slot.end) {
          warn(prof.name + " is booked twice at the same time (" + x.course.name + " and " + y.course.name + ").");
        }
      }
    }
  });

  WORKSHOPS.forEach(function (w) {
    if (skillIds.indexOf(w.skill) === -1) warn("Workshop \"" + w.title + "\" has skill \"" + w.skill + "\", which is not in SURVEY_SKILLS.");
    (w.levels || []).forEach(function (l) { if (levelIds.indexOf(l) === -1) warn("Workshop \"" + w.title + "\" lists level \"" + l + "\", which is not in LEVELS."); });
    checkDay("Workshop", w.title, w.day);
    checkWindow("Workshop", w.title, [w.time], classLength(w));
  });
  MULTISPORT.forEach(function (m) {
    checkDay("Multisport session", m.title, m.day);
    checkWindow("Multisport session", m.title, [m.time], classLength(m));
  });
  THIS_WEEK.assignments.forEach(function (a) {
    if (!findById(COURSES, a.course)) warn("Assignment \"" + a.title + "\" uses course \"" + a.course + "\", which is not in COURSES.");
  });
  MATERIALS.forEach(function (m) {
    (m.levels || []).forEach(function (l) { if (levelIds.indexOf(l) === -1) warn("Material \"" + m.title + "\" lists level \"" + l + "\", which is not in LEVELS."); });
    if (m.course && !findById(COURSES, m.course)) warn("Material \"" + m.title + "\" uses course \"" + m.course + "\", which is not in COURSES.");
  });
  PORTAL_SECTIONS.forEach(function (key) {
    if (!TEXT.portal.sections[key]) warn("PORTAL_SECTIONS has \"" + key + "\", which is not a built-in section name.");
  });
  const extraIds = {};
  EXTRA_SECTIONS.forEach(function (x) {
    const id = safeId(x.id || x.title || "");
    if (extraIds[id]) warn("Two extra sections share the id \"" + x.id + "\". Give each one its own id.");
    extraIds[id] = true;
  });
  const levels = sortedLevels();
  if (levels.length && levels[0].minAverage > 0) warn("The lowest level should have minAverage: 0 so every student is placed.");

  // Logins (inside claude.ai professors need no email or password: the page owner opens the staff pages)
  const staffEmails = {};
  if (!cloudMode) PROFESSORS.forEach(function (p) {
    if (!p.email || !p.password) { warn(p.name + " has no email or password, so they cannot sign in."); return; }
    const email = String(p.email).toLowerCase();
    if (staffEmails[email]) warn("Two professors share the email " + p.email + ". Each needs their own.");
    staffEmails[email] = true;
  });
  SAMPLE_STUDENTS.forEach(function (s) {
    Object.keys(s.skills || {}).forEach(function (id) {
      if (skillIds.indexOf(id) === -1) warn("Sample student \"" + s.name + "\" has a score for \"" + id + "\", which is not in SURVEY_SKILLS.");
    });
  });

  warnings.forEach(function (message) { console.warn("[Summer School settings] " + message); });
  return warnings;
}


/* ---------- 4. Scoring and placement ---------- */
function scaleMax() { return Math.max.apply(null, SURVEY_SCALE.map(function (o) { return Number(o.value); })); }
function answersFor(answers, skill) { return Array.isArray(answers[skill.id]) ? answers[skill.id] : []; }
function isAnswered(value) { return typeof value === "number"; }

function firstUnansweredSkill(answers) {
  return SURVEY_SKILLS.findIndex(function (skill) {
    const list = answersFor(answers, skill);
    return skill.statements.some(function (_, i) { return !isAnswered(list[i]); });
  });
}
function countAnswered(answers) {
  let done = 0, total = 0;
  SURVEY_SKILLS.forEach(function (skill) {
    const list = answersFor(answers, skill);
    skill.statements.forEach(function (_, i) { total++; if (isAnswered(list[i])) done++; });
  });
  return { done: done, total: total };
}

// Works out the average score, the group and the two weakest skills.
function computeResult(answers) {
  let points = 0, count = 0, statements = 0;
  const skillScores = SURVEY_SKILLS.map(function (skill, index) {
    const list = answersFor(answers, skill);
    const values = skill.statements.map(function (_, i) { return list[i]; }).filter(isAnswered);
    const sum = values.reduce(function (a, b) { return a + b; }, 0);
    points += sum;
    count += values.length;
    statements += skill.statements.length;
    return { skill: skill, index: index, average: values.length ? sum / values.length : null };
  });
  const average = count ? points / count : 0;
  const weakest = skillScores
    .filter(function (s) { return s.average !== null; })
    .sort(function (a, b) { return a.average - b.average || a.index - b.index; })
    .slice(0, 2);
  return {
    skillScores: skillScores,
    totalPoints: points,
    possible: statements * scaleMax(),
    average: average,
    level: levelFor(average),
    weakest: weakest,
  };
}
// The highest level whose minAverage the student reaches.
function levelFor(average) {
  const levels = sortedLevels();
  let chosen = levels[0];
  levels.forEach(function (level) { if (average >= level.minAverage) chosen = level; });
  return chosen;
}
function currentResult() { return computeResult(state.answers); }


/* ---------- 5. Timetable maths ----------
   How the recommendation works, for each class day:
   1. Each course's three times are ranked by how close they are to the
      student's ideal start (a tie goes to the later time).
   2. Every combination of options for that day is tried. Combinations
      where classes overlap, or leave less than the break, are skipped.
   3. The combination with the smallest total distance from the ideal
      start wins. When nothing clashes, this is simply the closest option
      for every course. */
function classLength(item) { return Number(item.lengthMinutes) || Number(TIMETABLE.classLengthMinutes) || 60; }
function usableCourses(list) {
  return list.filter(function (c) { return Array.isArray(c.times) && c.times.length > 0 && c.times.every(isTime); });
}
function coursesForLevel(levelId) { return usableCourses(COURSES.filter(function (c) { return c.level === levelId; })); }
function coursesOnDay(levelId, day) { return coursesForLevel(levelId).filter(function (c) { return Number(c.day) === day; }); }
function slotFor(course, optionIndex) {
  const start = toMinutes(course.times[optionIndex]);
  return { start: start, end: start + classLength(course) };
}
function overlaps(a, b) { return a.start < b.end && b.start < a.end; }
function tooClose(a, b) {
  const gap = Number(TIMETABLE.breakBetweenClassesMinutes) || 0;
  return a.start < b.end + gap && b.start < a.end + gap;
}
function rankOptions(course, preferred) {
  return course.times
    .map(function (t, i) { return { i: i, start: toMinutes(t), distance: Math.abs(toMinutes(t) - preferred) }; })
    .sort(function (a, b) { return a.distance - b.distance || b.start - a.start; })
    .map(function (o) { return o.i; });
}
function recommendForDay(courses, preferred) {
  const ranked = courses.map(function (c) { return rankOptions(c, preferred); });
  const chosen = [];
  let best = null;
  (function explore(k, total, worst) {
    if (best && (total > best.total || (total === best.total && worst >= best.worst))) return;
    if (k === courses.length) { best = { total: total, worst: worst, picks: chosen.slice() }; return; }
    ranked[k].forEach(function (optionIndex) {
      const slot = slotFor(courses[k], optionIndex);
      const clash = chosen.some(function (picked, j) { return tooClose(slot, slotFor(courses[j], picked)); });
      if (clash) return;
      const distance = Math.abs(slot.start - preferred);
      chosen.push(optionIndex);
      explore(k + 1, total + distance, Math.max(worst, distance));
      chosen.pop();
    });
  })(0, 0, 0);
  const picks = {};
  courses.forEach(function (c, i) { picks[c.id] = best ? best.picks[i] : ranked[i][0]; });
  return picks;
}
function preferredFor(prefs, day) { return toMinutes(isTime(prefs[day]) ? prefs[day] : TIMETABLE.defaultPreferredStart); }
function recommendAll(levelId, prefs) {
  const picks = {};
  TIMETABLE.classDays.forEach(function (_, i) {
    Object.assign(picks, recommendForDay(coursesOnDay(levelId, i + 1), preferredFor(prefs, i + 1)));
  });
  return picks;
}
// Saved choices, with the recommendation filling any gaps (e.g. a newly added course).
function completePicks(levelId, savedPicks, prefs) {
  const recommended = recommendAll(levelId, prefs);
  const picks = {};
  coursesForLevel(levelId).forEach(function (course) {
    const saved = savedPicks ? savedPicks[course.id] : undefined;
    picks[course.id] = Number.isInteger(saved) && saved >= 0 && saved < course.times.length ? saved : recommended[course.id];
  });
  return picks;
}
function findClashes(levelId, picks) {
  const clashes = {};
  TIMETABLE.classDays.forEach(function (_, i) {
    const courses = coursesOnDay(levelId, i + 1);
    for (let a = 0; a < courses.length; a++) {
      for (let b = a + 1; b < courses.length; b++) {
        if (tooClose(slotFor(courses[a], picks[courses[a].id]), slotFor(courses[b], picks[courses[b].id]))) {
          (clashes[courses[a].id] = clashes[courses[a].id] || []).push(courses[b]);
          (clashes[courses[b].id] = clashes[courses[b].id] || []).push(courses[a]);
        }
      }
    }
  });
  return clashes;
}
function confirmedPicks(levelId) { return completePicks(levelId, state.timetable.picks, state.timetable.prefs); }
// The confirmed classes on one day, sorted by start time.
function classesOnDay(levelId, day, picks) {
  return coursesOnDay(levelId, day)
    .map(function (course) { return { course: course, slot: slotFor(course, picks[course.id]) }; })
    .sort(function (a, b) { return a.slot.start - b.slot.start; });
}

/* The logo: a gold sun rising over a navy open book ("summer" + "school").
   Colours come from the theme, so it changes if you change the colours.
   The same drawing is used as the little icon in the browser tab. */
function brandMarkSvg(colours) {
  let rays = "";
  [200, 235, 270, 305, 340].forEach(function (degrees) {
    const angle = degrees * Math.PI / 180;
    const x1 = (24 + 11 * Math.cos(angle)).toFixed(2), y1 = (27 + 11 * Math.sin(angle)).toFixed(2);
    const x2 = (24 + 15.5 * Math.cos(angle)).toFixed(2), y2 = (27 + 15.5 * Math.sin(angle)).toFixed(2);
    rays += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
  });
  return '<svg viewBox="6 8 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">' +
    '<g style="stroke:' + colours.sun + '" stroke-width="2.6" stroke-linecap="round">' + rays + '</g>' +
    '<circle cx="24" cy="27" r="7.5" style="fill:' + colours.sun + '"/>' +
    '<path d="M8.5 30 C 14 27.2, 19.5 27.6, 24 31 L 24 40.5 C 19.5 37.4, 14 37, 8.5 39.6 Z" style="fill:' + colours.page + '"/>' +
    '<path d="M39.5 30 C 34 27.2, 28.5 27.6, 24 31 L 24 40.5 C 28.5 37.4, 34 37, 39.5 39.6 Z" style="fill:' + colours.pageShade + '"/>' +
    '</svg>';
}
function brandMark() {
  const mark = h("span", { class: "brand-mark", "aria-hidden": "true" });
  mark.innerHTML = brandMarkSvg({
    sun: "var(--color-title-accent)", page: "var(--color-primary)", pageShade: "var(--color-primary-hover)",
  });
  return mark;
}
// Site name in the top bar, with the SITE.titleHighlight words in gold italics.
function brandName() {
  const text = SITE.siteName;
  const highlight = SITE.titleHighlight || "";
  const at = highlight ? text.lastIndexOf(highlight) : -1;
  if (at === -1) return h("span", { class: "brand-name" }, text);
  return h("span", { class: "brand-name" },
    text.slice(0, at),
    h("span", { class: "brand-highlight" }, highlight),
    text.slice(at + highlight.length)
  );
}
// Puts the logo in the browser tab, using the theme's actual colours.
function setFavicon() {
  try {
    const root = getComputedStyle(document.documentElement);
    const read = function (name, fallback) { return root.getPropertyValue(name).trim() || fallback; };
    const svg = brandMarkSvg({
      sun: read("--color-title-accent", "#A0731E"), page: read("--color-primary", "#0B2E4F"), pageShade: read("--color-primary-hover", "#154270"),
    });
    let link = document.querySelector('link[rel="icon"]');
    if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
    link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  } catch (error) { /* the tab icon is optional */ }
}

/* ---------- Live updates ----------
   When another tab on this device changes something (a student signs in,
   finishes the survey or confirms a timetable; a professor lists an
   assignment), this tab updates by itself. */
function onSharedChange(event) {
  if (online.on || event.key !== SITE.storageName) return;
  db = loadDb();
  if (isStudent() && !db.logins[session.email]) session = null;
  if (isStudent()) state = loadStudentState(db.students[session.email]);
  refreshAfterRemoteChange();
}
// Shows changes made somewhere else (another tab, or online by another person)
// without losing the visitor's place on the page.
function refreshAfterRemoteChange() {
  const screen = currentScreen();
  if (screen !== "portal" && screen !== "staff") return;
  const active = document.activeElement;
  const typing = active && active.closest && active.closest("main") && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
  if (typing) { showToast(TEXT.live.waiting, true, true); return; }
  render({ focusId: active && active.id ? active.id : null, keepFocusScroll: true });
  const latest = db.activity[0];
  const updated = online.on ? TEXT.live.updatedOnline : TEXT.live.updated;
  showToast(isProfessor() && latest ? fill(TEXT.staff.activity.types[latest.type] || updated, { user: nameFromEmail(latest.email), detail: latest.detail }) : updated, false, true);
}
// A small message in the corner that disappears by itself.
function showToast(message, withButton, isLive) {
  let box = document.getElementById("live-toast");
  if (!box) { box = h("div", { id: "live-toast", class: "toast", role: "status", "aria-live": "polite" }); document.body.appendChild(box); }
  box.textContent = "";
  if (isLive) box.appendChild(h("span", { class: "badge badge-live" }, TEXT.live.badge));
  box.appendChild(h("span", {}, message));
  if (withButton) {
    box.appendChild(h("button", { type: "button", class: "btn btn-secondary btn-small", onClick: function () { hideToast(); render({ keepFocusScroll: true }); } }, TEXT.live.refreshButton));
  }
  box.classList.add("is-visible");
  window.clearTimeout(showToast.timer);
  if (!withButton) showToast.timer = window.setTimeout(hideToast, 6000);
}
// A small "Are you sure?" box inside the page (browser pop-ups are blocked on some sites).
function confirmInPage(message, yesLabel, onYes) {
  const before = document.activeElement;
  const box = h("dialog", { class: "confirm-box", "aria-labelledby": "confirm-text" },
    h("p", { id: "confirm-text" }, message),

function handleSignIn(event) {
  event.preventDefault();
  if (webMode) { handleWebSignIn(); return; }
  if (hosted) { handleHostedSignIn(); return; }
  const words = TEXT.login;
  const roleInput = document.querySelector('input[name="login-role"]:checked');
  const role = roleInput ? roleInput.value : "student";
  const emailBox = document.getElementById("login-email");
  const passwordBox = document.getElementById("login-password");
  const email = emailBox.value.trim().toLowerCase();
  const password = passwordBox.value;
  const errorBox = document.getElementById("login-error");
  emailBox.removeAttribute("aria-invalid");
  passwordBox.removeAttribute("aria-invalid");
  function fail(message, box) {
    errorBox.textContent = message;
    box.setAttribute("aria-invalid", "true");
    box.focus();
  }
  function professorWithEmail(address) {
    return PROFESSORS.find(function (p) { return p.email && String(p.email).toLowerCase() === address; }) || null;
  }

  if (role === "professor") {
    const prof = professorWithEmail(email);
    if (!prof || prof.password !== password) { fail(words.errorProfessor, emailBox); return; }
    session = { role: "professor", email: email, professorId: prof.id };
    state = freshState();
    ui = freshUi();
    ui.signInNotice = fill(words.welcomeBackNotice, { name: prof.name });
    save();
    render({ focusId: "screen-heading", scrollTop: true });
    return;
  }

  // Students type their full university email: username + domain, e.g. ibz4000@university.ac.uk.
  if (professorWithEmail(email)) { fail(words.errorStaffEmailAsStudent, emailBox); return; }
  if (!studentIdFrom(email)) { fail(studentIdError(), emailBox); return; }
  if (password.length < (Number(LOGIN.minimumPasswordLength) || 1)) {
    fail(fill(words.errorPasswordShort, { count: LOGIN.minimumPasswordLength }), passwordBox); return;
  }
  const hash = scramble(email + "|" + password);
  const existing = db.logins[email];
  if (existing && existing.hash !== hash) { fail(words.errorWrongPassword, passwordBox); return; }
  if (!existing) db.logins[email] = { hash: hash, createdAt: new Date().toISOString() };

  session = { role: "student", email: email };
  logActivity(existing ? "signin" : "account", email);
  state = loadStudentState(db.students[email]);
  ui = freshUi();
  ui.signInNotice = fill(existing ? words.welcomeBackNotice : words.createdNotice, { name: nameFromEmail(email) });
  save();
  render({ focusId: state.screen === "welcome" ? "welcome-start" : "screen-heading", scrollTop: true });
}
// Checks what a student typed: a username of LOGIN.usernameLength characters
// (letters then numbers), followed by LOGIN.emailDomain when one is set.
function studentIdFrom(typed) {
  const domain = String(LOGIN.emailDomain || "").toLowerCase();
  const length = Number(LOGIN.usernameLength) || 0;
  let username = typed;
  if (domain) {
    if (typed.length <= domain.length || typed.slice(-domain.length) !== domain) return null;
    username = typed.slice(0, -domain.length);
  }
  if (!/^[a-z]+[0-9]+$/.test(username) || (length && username.length !== length)) return null;
  return typed;
}
function studentIdError() {
  const length = Number(LOGIN.usernameLength) || 0;
  return LOGIN.emailDomain ? fill(TEXT.login.errorUsername, { length: length, domain: LOGIN.emailDomain })
    : fill(TEXT.online.errorUsernameOnly, { length: length });
}
// Inside claude.ai there are no passwords: Claude's own sign-in says who is who.
// Students type their username (or email); only the page owner can open the professor pages.
function handleHostedSignIn() {
  const words = TEXT.login;
  const ow = TEXT.online;
  const roleInput = document.querySelector('input[name="login-role"]:checked');
  const role = roleInput ? roleInput.value : "student";
  const errorBox = document.getElementById("login-error");
  function fail(message, box) {
    errorBox.textContent = message;
    if (box) { box.setAttribute("aria-invalid", "true"); box.focus(); }
  }
  writeJson("sessionStorage", storageKey("online-signed-out"), null);
  if (role === "professor") {
    const pick = document.getElementById("login-professor");
    const prof = pick ? findById(PROFESSORS, pick.value) : null;
    if (!online.on || !online.isOwner || !prof) { fail(ow.errorNotOwner, pick); return; }
    session = { role: "professor", email: prof.name, professorId: prof.id };
    state = freshState();
    ui = freshUi();
    ui.signInNotice = fill(words.welcomeBackNotice, { name: prof.name });
    save();
    render({ focusId: "screen-heading", scrollTop: true });
    return;
  }
  const box = document.getElementById("login-email");
  box.removeAttribute("aria-invalid");
  const typed = box.value.trim().toLowerCase();
  if (!studentIdFrom(typed)) { fail(studentIdError(), box); return; }
  let existing;
  if (online.on) {
    const mine = online.docs[online.uid];
    existing = !!mine;
    online.username = typed;
    session = { role: "student", email: typed };
    state = loadStudentState(mine ? mine.state : null);
  } else {
    existing = !!db.logins[typed];
    if (!existing) db.logins[typed] = { createdAt: new Date().toISOString() };
    session = { role: "student", email: typed };
    state = loadStudentState(db.students[typed]);
  }
  logActivity(existing ? "signin" : "account", typed);
  ui = freshUi();
  ui.signInNotice = fill(existing ? words.welcomeBackNotice : (online.on ? ow.createdNotice : ow.createdBrowserNotice), { name: nameFromEmail(typed) });
  save();
  render({ focusId: state.screen === "welcome" ? "welcome-start" : "screen-heading", scrollTop: true });
}

// The big title. Each letter is its own <span> so the gold shimmer can move
// through it; the words in SITE.titleHighlight stay gold and italic.
// Screen readers read the hidden plain copy instead of the single letters.
function animatedTitle() {
  const text = SITE.siteName;
  const highlight = SITE.titleHighlight || "";
  const highlightAt = highlight ? text.lastIndexOf(highlight) : -1;
  const letters = h("span", { "aria-hidden": "true" });
  let position = 0;
  let waveIndex = 0;
  let highlightGroup = null;   // the gold words share one group so they never split across lines
  text.split(" ").forEach(function (word, w) {
    const inHighlight = highlightAt !== -1 && position + (w > 0 ? 1 : 0) >= highlightAt &&
                        position + (w > 0 ? 1 : 0) + word.length <= highlightAt + highlight.length;
    if (w > 0) {
      (inHighlight && highlightGroup ? highlightGroup : letters).appendChild(document.createTextNode(" "));
      position += 1;
    }
    let wordSpan;
    if (inHighlight) {
      if (!highlightGroup) { highlightGroup = h("span", { class: "title-word" }); letters.appendChild(highlightGroup); }
      wordSpan = highlightGroup;
    } else {
      wordSpan = h("span", { class: "title-word" });
      letters.appendChild(wordSpan);
    }
    Array.from(word).forEach(function (character) {
      wordSpan.appendChild(inHighlight
        ? h("span", { class: "title-letter is-highlight" }, character)
        : h("span", { class: "title-letter", style: "--i:" + waveIndex++ }, character));
      position += character.length;
    });
  });
  return h("h1", { id: "screen-heading", tabindex: "-1", class: "welcome-title rise", style: "--order:1" },
    h("span", { class: "visually-hidden" }, text),
    letters
  );
}

// Screen 3: Survey (one skill per screen)
function questionId(skill, statementIndex) { return "q-" + safeId(skill.id) + "-" + statementIndex; }

function screenSurvey() {
  const index = state.surveyIndex;
  const skill = SURVEY_SKILLS[index];
  const saved = answersFor(state.answers, skill);
  const isLast = index === SURVEY_SKILLS.length - 1;
  const counts = countAnswered(state.answers);

  const questions = skill.statements.map(function (statement, sIndex) {
    const groupId = questionId(skill, sIndex);
    return h("fieldset", { class: "question", id: groupId },
      h("legend", { class: "question-text" }, h("span", { class: "question-number", "aria-hidden": "true" }, String(sIndex + 1)), h("span", {}, statement)),
      h("div", { class: "scale" }, SURVEY_SCALE.map(function (option) {
        const value = Number(option.value);
        const inputId = groupId + "-" + value;
        const chosen = saved[sIndex] === value;
        return h("label", { class: "scale-option" + (chosen ? " is-selected" : ""), for: inputId },
          h("input", {
            type: "radio", class: "scale-input", id: inputId, name: groupId, value: value, checked: chosen,
            onChange: function () { answerStatement(skill, sIndex, value); },
          }),
          h("span", { class: "scale-bubble", "aria-hidden": "true" }, String(value)),
          h("span", { class: "scale-label" }, option.label)
        );
      }))
    );
  });

  const previous = SURVEY_SKILLS[index - 1];
  const next = SURVEY_SKILLS[index + 1];
  return h("div", { class: "card" },
    h("p", { class: "kicker" }, fill(TEXT.survey.kicker, { current: index + 1, total: SURVEY_SKILLS.length })),
    h("h1", { id: "screen-heading", tabindex: "-1" }, skill.name),
    h("p", { class: "muted" }, skill.intro),
    progressBar(counts),
    h("p", { style: "font-weight:600" }, TEXT.survey.question),
    questions,
    h("p", { id: "survey-error", class: "form-error", role: "alert" }),
    h("div", { class: "actions" },
      h("button", {
        type: "button", class: "btn btn-secondary",
        onClick: function () {
          if (index === 0) { go("terms"); return; }
          state.surveyIndex = index - 1;
          go("survey");
        },
      }, previous ? fill(TEXT.survey.backButton, { skill: previous.name }) : TEXT.survey.backToTermsButton),
      h("button", { type: "button", class: "btn btn-primary", onClick: surveyNext },
        isLast ? TEXT.survey.finishButton : fill(TEXT.survey.nextButton, { skill: next.name }))
    ),
    h("p", { class: "small muted", style: "margin:16px 0 0" }, TEXT.survey.savedNote)
  );
}

function progressBar(counts) {
  const percent = counts.total ? Math.round((counts.done / counts.total) * 100) : 0;
  const text = fill(TEXT.survey.progress, { done: counts.done, total: counts.total });
  return h("div", { class: "progress" },
    h("div", { class: "progress-text", "aria-hidden": "true" },
      h("span", { id: "survey-progress-text" }, text),
      h("span", { id: "survey-progress-percent" }, percent + "%")
    ),
    h("div", {
      class: "progress-track", id: "survey-progressbar", role: "progressbar", "aria-label": TEXT.survey.progressLabel,
      "aria-valuemin": 0, "aria-valuemax": counts.total, "aria-valuenow": counts.done, "aria-valuetext": text,
    }, h("div", { class: "progress-fill", id: "survey-progress-fill", style: "width:" + percent + "%" }))
  );
}

// Saves one answer straight away and updates the page without redrawing it.
function answerStatement(skill, statementIndex, value) {
  const list = answersFor(state.answers, skill).slice();
  list[statementIndex] = value;
  state.answers[skill.id] = list;
  save();

  const group = document.getElementById(questionId(skill, statementIndex));
  if (group) {
    group.classList.remove("is-missing");
    group.querySelectorAll(".scale-option").forEach(function (label) {
      label.classList.toggle("is-selected", label.querySelector("input").checked);
    });
  }
  const counts = countAnswered(state.answers);
  const percent = counts.total ? Math.round((counts.done / counts.total) * 100) : 0;
  const text = fill(TEXT.survey.progress, { done: counts.done, total: counts.total });
  document.getElementById("survey-progress-text").textContent = text;
  document.getElementById("survey-progress-percent").textContent = percent + "%";
  document.getElementById("survey-progress-fill").style.width = percent + "%";
  const bar = document.getElementById("survey-progressbar");
  bar.setAttribute("aria-valuenow", counts.done);
  bar.setAttribute("aria-valuetext", text);
  const stillMissing = skill.statements.some(function (_, i) { return !isAnswered(state.answers[skill.id][i]); });
  if (!stillMissing) document.getElementById("survey-error").textContent = "";
}

function surveyNext() {
  const skill = SURVEY_SKILLS[state.surveyIndex];
  const saved = answersFor(state.answers, skill);
  const missing = skill.statements.map(function (_, i) { return i; }).filter(function (i) { return !isAnswered(saved[i]); });
  if (missing.length) {
    document.getElementById("survey-error").textContent = fill(TEXT.survey.missing, { count: missing.length });
    missing.forEach(function (i) { document.getElementById(questionId(skill, i)).classList.add("is-missing"); });
    const firstInput = document.querySelector("#" + questionId(skill, missing[0]) + " input");
    if (firstInput) firstInput.focus();
    return;
  }
  if (state.surveyIndex < SURVEY_SKILLS.length - 1) {
    state.surveyIndex += 1;
    go("survey");
  } else {
    logActivity("survey", session.email, computeResult(state.answers).level.name);
    go("result");
  }
}

// Screen 4: Result
function meter(fraction) {
  return h("div", { class: "meter", "aria-hidden": "true" }, h("span", { style: "width:" + Math.round(Math.max(0, Math.min(1, fraction)) * 100) + "%" }));
}
function placementRule() {
  const levels = sortedLevels();
  return levels.map(function (level, i) {
    const next = levels[i + 1];
    const values = { level: level.name, min: level.minAverage, next: next ? next.minAverage : "" };
    if (levels.length === 1) return level.name;
    if (i === 0) return fill(TEXT.result.ruleFirst, values);
    if (!next) return fill(TEXT.result.ruleLast, values);
    return fill(TEXT.result.ruleMiddle, values);
  }).join(" · ");
}

// Screen 5: Timetable picker
function timeChoices(current) {
  const step = Math.max(1, Number(TIMETABLE.preferenceStepMinutes) || 5);
  const list = [];
  for (let m = toMinutes(TIMETABLE.dayStart); m <= toMinutes(TIMETABLE.dayEnd); m += step) list.push(toTime(m));
  if (isTime(current) && list.indexOf(current) === -1) { list.push(current); list.sort(); }
  return list;
}

  const level = result.level;
  const editing = !!state.timetable;
  const draft = state.draft;
  const days = TIMETABLE.classDays.map(function (label, i) { return { day: i + 1, label: label }; });
  days.forEach(function (d) { if (!isTime(draft.prefs[d.day])) draft.prefs[d.day] = TIMETABLE.defaultPreferredStart; });

  const showOptions = draft.stage === "options";
  const recommended = recommendAll(level.id, draft.prefs);
  const picks = showOptions ? completePicks(level.id, draft.picks, draft.prefs) : {};
  const clashes = showOptions ? findClashes(level.id, picks) : {};
  const hasClash = Object.keys(clashes).length > 0;

function portalSections(level) {
  const builders = {
    home: sectionHome, timetable: sectionTimetable, help: sectionHelp, week: sectionWeek, materials: sectionMaterials,
    fees: sectionFees, activities: sectionActivities, support: sectionSupport, book: sectionBook, ai: sectionAi,
  };
  const values = { level: level.name };
  const list = [];
  PORTAL_SECTIONS.forEach(function (key) {
    const words = TEXT.portal.sections[key];
    if (!builders[key] || !words) return;
    list.push({ id: key, menu: fill(words.menu, values), title: fill(words.title, values), summary: fill(words.summary, values), build: builders[key] });
  });
  EXTRA_SECTIONS.forEach(function (entry, index) {
    list.push({
      id: "extra-" + (safeId(entry.id || entry.title || "") || index),
      menu: entry.menuLabel || entry.title, title: entry.title, summary: entry.summary || "",
      build: function (sec) { return sectionExtra(sec, entry); },
    });
  });
  return list;
}

// The portal shows one page at a time; the menu at the top switches pages.
function screenPortal(result, sections, page) {
  const context = { level: result.level, result: result, sections: sections };
  const current = sections.find(function (sec) { return sec.id === page; }) || sections[0];
  return current ? current.build(current, context) : null;
}

// One page (or one block inside a page). The page title is the page's
// main heading (h1); blocks inside a page with its own h1 use h2.
function sectionWrap(sec, extraTitleBits) {
  const body = Array.prototype.slice.call(arguments, 2);
  const asPage = !sec.subsection;
  return h("section", { class: "portal-section" + (asPage ? " portal-page" : ""), id: "section-" + sec.id, "data-section": sec.id, "aria-labelledby": asPage ? "screen-heading" : "heading-" + sec.id },
    h(asPage ? "h1" : "h2", { class: "section-title", id: asPage ? "screen-heading" : "heading-" + sec.id, tabindex: "-1" }, sec.title, extraTitleBits),
    body
  );
}

/* Pages are chosen by the part of the address after #, e.g. index.html#fees,
   so the browser's Back button moves between pages. */
function pageFromHash(sections) {
  let id = "";
  try { id = decodeURIComponent((window.location.hash || "").slice(1)); } catch (error) { id = ""; }
  return sections.some(function (sec) { return sec.id === id; }) ? id : (sections[0] ? sections[0].id : "");
}
function setHash(id) {
  try { window.history.replaceState(null, "", id ? "#" + id : window.location.pathname + window.location.search); }
  catch (error) { if (id) window.location.hash = id; }
}

const WEEKDAY_NAMES = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
function nextClassDay() {
  const today = new Date().getDay();
  const days = TIMETABLE.classDays.map(function (name, i) {
    return { day: i + 1, label: name, weekday: WEEKDAY_NAMES.indexOf(String(name).toLowerCase()) };
  });
  for (let offset = 0; offset < 7; offset++) {
    const match = days.find(function (d) { return d.weekday === (today + offset) % 7; });
    if (match) return Object.assign({ isToday: offset === 0 }, match);
  }
  return days.length ? Object.assign({ isToday: false }, days[0]) : null;
}

// This week
function pickWorkshop(weakest, levelId) {
  for (let i = 0; i < weakest.length; i++) {
    const skillId = weakest[i].skill.id;
    const match = WORKSHOPS.find(function (w) { return w.skill === skillId && includesLevel(w, levelId); }) ||
                  WORKSHOPS.find(function (w) { return w.skill === skillId; });
    if (match) return { workshop: match, skill: weakest[i].skill };
  }
  return null;
}
function sessionWhen(item) {
  const start = toMinutes(item.time);
  return fill(TEXT.portal.week.extraWhen, { day: dayName(item.day), time: timeRange(start, start + classLength(item)) });
}
function clashingClass(levelId, item) {
  if (!isTime(item.time)) return null;
  const start = toMinutes(item.time);
  const slot = { start: start, end: start + classLength(item) };
  const hit = classesOnDay(levelId, Number(item.day), confirmedPicks(levelId)).find(function (c) { return overlaps(slot, c.slot); });
  return hit ? hit.course : null;
}

/* Assignments come from two places: THIS_WEEK in the settings, and the ones
   professors create in their staff console (saved on this device).
   Students only ever see the ones that are published (reviewed). */
function allAssignments() {
  const created = db.assignments.slice().reverse().map(function (a) { return Object.assign({ source: "created" }, a); });
  const fromSettings = THIS_WEEK.assignments.map(function (a) { return Object.assign({ source: "settings" }, a); });
  return created.concat(fromSettings);
}
function isPublished(assignment) {
  if (assignment.source === "settings" && Object.prototype.hasOwnProperty.call(db.assignmentReview, assignment.id)) {
    return db.assignmentReview[assignment.id] === true;
  }
  return assignment.reviewedByProfessor === true;
}
function publishedAssignmentsFor(levelId) {
  return allAssignments().filter(function (a) {
    const course = findById(COURSES, a.course);
    return isPublished(a) && course && course.level === levelId;
  });
}

// Every student the professor can see: real students who signed in (on this device,
// or online), plus SAMPLE_STUDENTS if any were added. The site does not take
// attendance yet, so real students show "–" for attendance rather than a made-up number.
function studentRecords() {
  const records = [];
  Object.keys(db.students).forEach(function (email) {
    const st = db.students[email] || {};
    const answers = st.answers || {};
    const finished = firstUnansweredSkill(answers) === -1;
    const r = finished ? computeResult(answers) : null;
    records.push({
      name: nameFromEmail(email), email: email, source: online.on ? "online" : "device", completed: finished,
      level: r ? r.level : null, average: r ? r.average : null,
      skillScores: r ? r.skillScores : [], weakest: r ? r.weakest : [],
      attendancePercent: null,
      timetableConfirmed: !!st.timetable,
    });
  });
  SAMPLE_STUDENTS.forEach(function (sample) {
    const skills = sample.skills || {};
    const scores = SURVEY_SKILLS.map(function (skill, index) {
      return { skill: skill, index: index, average: typeof skills[skill.id] === "number" ? skills[skill.id] : null };
    });
    const average = mean(scores.map(function (s) { return s.average; })) || 0;
    records.push({
      name: sample.name, email: sample.email, source: "sample", completed: true,
      level: levelFor(average), average: average, skillScores: scores, weakest: weakestTwo(scores),
      attendancePercent: typeof sample.attendancePercent === "number" ? sample.attendancePercent : null,
      timetableConfirmed: !!sample.timetableConfirmed,
    });
  });
  return records;
}

// "2 min ago", "just now"... for the live activity feed.
function timeAgo(iso) {
  const words = TEXT.staff.activity;
  const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 45) return words.justNow;
  if (seconds < 3600) return fill(words.minutesAgo, { count: Math.round(seconds / 60) });
  if (seconds < 86400) return fill(words.hoursAgo, { count: Math.round(seconds / 3600) });

}

      ),
      h("p", { class: "chat-foot" }, fill(words.footnote, { margin: marginText() }))
    )

function drawChat(typing) {
  const log = document.getElementById("chat-log");
  const prof = currentProfessor();
  if (!log || !prof) return;
  const words = TEXT.staff.assistant;
  const messages = chatFor(prof);
  log.textContent = "";
  const all = messages.length ? messages : [{ from: "assistant", text: fill(words.greeting, { name: prof.name }) }];
  all.forEach(function (msg, index) {
    const actions = [];
    if (msg.kind === "draft" || msg.kind === "brief") {
      actions.push(h("button", { type: "button", class: "btn btn-quiet", onClick: function (event) { copyText(msg.text, event.target); } }, words.copyButton));
    }
    if (msg.kind === "brief" && !msg.added) {
      actions.push(h("button", { type: "button", class: "btn btn-secondary btn-small", onClick: function () { addBriefToBoard(index); } }, words.addToBoardButton));
    }
    if (msg.kind === "added") {
      actions.push(h("a", { class: "btn btn-secondary btn-small", href: "#staff-assignments" }, words.openBoardButton));
    }
    log.appendChild(h("li", { class: "chat-msg from-" + msg.from },
      h("span", { class: "visually-hidden" }, msg.from === "assistant" ? words.assistantSays : words.youSaid),
      h("div", { class: "chat-bubble" }, msg.text),
      actions.length ? h("div", { class: "chat-actions" }, actions) : null));
  });
  if (typing) log.appendChild(h("li", { class: "chat-msg from-assistant" }, h("div", { class: "chat-bubble chat-typing" }, words.typing)));
  log.scrollTop = log.scrollHeight;

function sendToAssistant(raw) {
  const text = String(raw || "").trim();
  const prof = currentProfessor();
  if (!text || !prof) return;
  const messages = chatFor(prof);
  messages.push({ from: "professor", text: text, at: new Date().toISOString() });
  save();
  drawChat(true);
  window.setTimeout(function () {
    const reply = assistantReply(text, prof);
    messages.push(Object.assign({ from: "assistant", at: new Date().toISOString() }, reply));
    db.chats[prof.id] = messages.slice(-60);
    save();
    drawChat(false);
  }, prefersReducedMotion() ? 150 : 650);
}
function copyText(text, button) {
  const done = function () { if (button) button.textContent = TEXT.staff.assistant.copiedButton; };
  try {
    navigator.clipboard.writeText(text).then(done, function () { if (button) button.textContent = TEXT.staff.assistant.copyFailed; });
  } catch (error) { if (button) button.textContent = TEXT.staff.assistant.copyFailed; }
}
// The next calendar date that falls on a course's class day, written like "Monday 17 November".
function nextDateForDay(dayNumber) {
  const target = WEEKDAY_NAMES.indexOf(String(dayName(dayNumber)).toLowerCase());
  const date = new Date();
  for (let i = 1; i <= 7 && target !== -1; i++) {
    date.setDate(date.getDate() + 1);
    if (date.getDay() === target) break;
  }
  return date.toISOString().slice(0, 10);
}
function addBriefToBoard(index) {
  const prof = currentProfessor();
  const messages = chatFor(prof);
  const msg = messages[index];
  if (!msg || !msg.data) return;
  const course = findById(COURSES, msg.data.course);
  db.assignments.push({
    id: "created-" + Date.now(), course: msg.data.course, title: msg.data.title,
    due: formatDue(nextDateForDay(course ? course.day : 1), "17:00"), details: msg.data.details,
    reviewedByProfessor: false, createdBy: prof.id, createdAt: new Date().toISOString(),
  });
  msg.added = true;
  messages.push({ from: "assistant", kind: "added", text: fill(TEXT.staff.assistant.addedReply, { title: msg.data.title }), at: new Date().toISOString() });
  save();
  drawChat(false);
}
// Chooses a reply from simple keyword rules, using the data on this device.
function assistantReply(text, prof) {
  const words = TEXT.staff.assistant;
  const lower = text.toLowerCase();
  const courses = professorCourses(prof);
  const levels = courses.map(function (c) { return c.level; });
  const course = courses[0] || null;
  const levelName = course ? levelById(course.level).name : "";
  const records = studentRecords().filter(function (r) { return r.completed && r.level && levels.indexOf(r.level.id) !== -1; });
  const max = scaleMax();

  if (/(email|remind)/.test(lower)) {
    const published = allAssignments().filter(function (a) { return isPublished(a) && courses.some(function (c) { return c.id === a.course; }); });
    const exams = THIS_WEEK.examReminders.filter(function (e) { return levels.some(function (l) { return includesLevel(e, l); }); });
    const lines = published.map(function (a) { return fill(words.emailAssignmentLine, { title: a.title, due: a.due }); })
      .concat(exams.map(function (e) { return fill(words.emailExamLine, { title: e.title, when: e.when }); }));
    return { kind: "draft", text: fill(words.emailDraft, {
      course: course ? course.name : "", level: levelName, day: course ? dayName(course.day) : "",
      lines: lines.length ? lines.join("\n") : words.emailNothingDue, name: prof.name }) };
  }
  if (/(support|struggl|help|risk|behind|need|weak)/.test(lower)) {
    if (!records.length) return { text: words.noStudents };
    const lowest = records.slice().sort(function (a, b) { return a.average - b.average; }).slice(0, 4);
    const lines = lowest.map(function (r, i) {
      const skill = r.weakest[0] ? r.weakest[0].skill : null;
      const workshop = skill ? workshopFor(skill.id, r.level.id) : null;
      return fill(words.supportLine, {
        n: i + 1, name: r.name, score: r.average.toFixed(1), max: max,
        skills: r.weakest.map(function (w) { return w.skill.name; }).join(", "),
        suggestion: workshop ? fill(words.supportWorkshop, { workshop: workshop.title, when: sessionWhen(workshop) }) : words.supportPractice });
    });
    return { text: fill(words.supportReply, { level: levelName, lines: lines.join("\n\n") }) };
  }
  if (/(brief|assignment|task|homework)/.test(lower)) {
    const counts = {};
    records.forEach(function (r) { r.weakest.forEach(function (w) { counts[w.skill.id] = (counts[w.skill.id] || 0) + 1; }); });
    const topId = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })[0];
    const skill = findById(SURVEY_SKILLS, topId) || SURVEY_SKILLS[0];
    const title = fill(words.briefTitle, { skill: skill.name, course: course ? course.name : "" });
    const details = fill(words.briefDetails, { skill: skill.name, course: course ? course.name : "" });
    return { kind: "brief", text: fill(words.briefReply, { title: title, details: details, skill: skill.name }),
      data: { course: course ? course.id : COURSES[0].id, title: title, details: details } };
  }
  if (/(summar|session|lecture|today|class)/.test(lower)) {
    const attendance = mean(records.map(function (r) { return r.attendancePercent; }));
    return { text: fill(words.summaryReply, { course: course ? course.name : "", level: levelName,
      attendance: attendance === null ? "–" : Math.round(attendance), students: records.length }) };
  }
  if (/(attend|present|absent)/.test(lower)) {
    const attendance = mean(records.map(function (r) { return r.attendancePercent; }));
    return { text: fill(words.attendanceReply, { level: levelName, value: attendance === null ? "–" : Math.round(attendance) }) };
  }
  if (/(how many|students|overview|group|cohort|doing|progress)/.test(lower)) {
    const average = mean(records.map(function (r) { return r.average; }));
    return { text: fill(words.overviewReply, { level: levelName, count: records.length,
      average: average === null ? "–" : average.toFixed(1), max: max }) };
  }
  return { text: words.helpReply };
}

/* ---------- 9. Motion: smooth scrolling (Lenis) and animations (GSAP) ----------
   Both are optional extras. If the libraries are missing, switched off in
   EFFECTS, or the device asks for reduced motion, the site works exactly
   the same, just without the movement. */
let lenis = null;
function motionWanted() { return !prefersReducedMotion(); }
function gsapReady() { return typeof window.gsap !== "undefined" && typeof window.ScrollTrigger !== "undefined"; }

function setupMotion() {
  if (gsapReady()) gsap.registerPlugin(ScrollTrigger);
  if (!EFFECTS.smoothScroll || !motionWanted() || typeof window.Lenis !== "function") return;
  try {
    lenis = new window.Lenis({ lerp: 0.1, smoothWheel: true, allowNestedScroll: true });
    if (gsapReady()) {
      lenis.on("scroll", ScrollTrigger.update);
      gsap.ticker.add(function (time) { lenis.raf(time * 1000); });
      gsap.ticker.lagSmoothing(0);
    } else {
      const loop = function (time) { lenis.raf(time); window.requestAnimationFrame(loop); };
      window.requestAnimationFrame(loop);
    }
  } catch (error) { lenis = null; }
}
// Jumps to a position at once (used when the page is redrawn).
function scrollToY(y) {
  if (lenis) { lenis.resize(); lenis.scrollTo(y, { immediate: true, force: true }); }
  else window.scrollTo({ top: y, behavior: "instant" });
}
// Glides smoothly to an element. Returns false when smooth scrolling is off.
// The space left above the element comes from its CSS scroll-margin-top
// (the height of the sticky top bar), which Lenis respects.
function smoothScrollTo(element) {
  if (!lenis || !element) return false;
  lenis.scrollTo(element, { duration: 1.1 });
  return true;
}
// Runs a GSAP animation only when there is something to animate (avoids console warnings).
function animate(method, targets, vars) {
  const list = gsap.utils.toArray(targets);
  if (list.length) gsap[method](list, vars);
  return list;
}

// Called after every redraw. New pages get an entrance; small redraws do not.
function refreshMotion(screen, isNewPage) {
  if (!gsapReady()) return;
  ScrollTrigger.getAll().forEach(function (trigger) { trigger.kill(); });
  if (!EFFECTS.animations || !motionWanted()) return;
  if (screen === "welcome") {
    document.getElementById("app").classList.add("motion-on");
    if (isNewPage) welcomeEntrance();
    welcomeDepth();
  } else if (isNewPage) {
    pageEntrance(screen);
  }
  ScrollTrigger.refresh();
}

// Welcome page: the label, title words, text and button rise in, then the photos.
function welcomeEntrance() {
  gsap.timeline({ defaults: { ease: "power3.out" } })
    .from(".welcome-kicker", { y: 14, opacity: 0, duration: 0.6 })
    .from(".welcome-title .title-word", { y: 42, opacity: 0, duration: 0.95, stagger: 0.09 }, "-=0.35")
    .from(".welcome-intro", { y: 18, opacity: 0, duration: 0.7 }, "-=0.6")
    .from(".welcome-cta", { y: 18, opacity: 0, duration: 0.7 }, "-=0.5")
    .from(".welcome-picture", { yPercent: 22, opacity: 0, duration: 1.2, stagger: 0.12, ease: "expo.out" }, "-=0.45");
}
// Welcome photos: as you scroll, each photo drifts inside its card and the
// cards move at slightly different speeds, which gives a sense of depth.
function welcomeDepth() {
  gsap.utils.toArray(".welcome-picture").forEach(function (card, index) {
    const media = card.querySelector("img, svg");
    if (media && !card.classList.contains("is-wide")) {   // wide cards show the whole photo, so no zoom
      gsap.set(media, { scale: 1.14 });
      gsap.fromTo(media, { yPercent: -5 }, { yPercent: 5, ease: "none",
        scrollTrigger: { trigger: card, start: "top bottom", end: "bottom top", scrub: true } });
    }
    gsap.to(card, { y: index % 2 ? -40 : -14, ease: "none",
      scrollTrigger: { trigger: ".welcome-pictures", start: "top bottom", end: "bottom top", scrub: true } });
  });
}
// Other pages: content rises in; in the portal and staff console, cards fade
// up as they scroll into view, bars fill and numbers count up.
function pageEntrance(screen) {
  const main = document.getElementById("main");
  if (screen === "portal" || screen === "staff") {
    animate("from", ".portal-head > *, #signin-notice, #confirmed-notice", { y: 20, opacity: 0, duration: 0.75, stagger: 0.08, ease: "power3.out" });
    const cards = gsap.utils.toArray("#main .portal-section .mini-card, #main .portal-section > .card, #main .portal-section .banner, " +
      "#main .portal-section .day-col, #main .portal-section .stat, #main .portal-section .table-wrap, #main .portal-section .toolbar, " +
      "#main .promo, #main .fee-card, #main .console-card, #main .material-card, #main .canvas-callout");
    // Home page banners: the photo drifts slightly inside its banner as you scroll.
    gsap.utils.toArray("#main .promo-photo").forEach(function (photo) {
      gsap.fromTo(photo, { yPercent: -6 }, { yPercent: 6, ease: "none",
        scrollTrigger: { trigger: photo.parentElement, start: "top bottom", end: "bottom top", scrub: true } });
    });
    if (cards.length) gsap.set(cards, { opacity: 0, y: 34 });
    if (cards.length) ScrollTrigger.batch(cards, { start: "top 94%", once: true,
      onEnter: function (batch) { gsap.to(batch, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", stagger: 0.08, overwrite: true }); } });
    const bars = gsap.utils.toArray("#main .portal-section .meter span");
    if (bars.length) ScrollTrigger.batch(bars, { start: "top 96%", once: true,
      onEnter: function (batch) { gsap.from(batch, { scaleX: 0, transformOrigin: "left center", duration: 1.1, ease: "power2.out", stagger: 0.04 }); } });
  } else {
    animate("from", Array.prototype.slice.call(main.children), { y: 18, opacity: 0, duration: 0.6, stagger: 0.07, ease: "power2.out" });
    animate("from", "#main .meter span", { scaleX: 0, transformOrigin: "left center", duration: 1.1, ease: "power2.out", stagger: 0.05, delay: 0.25 });
  }
  countUp();
}
// Numbers marked with data-count-to count up from zero when they come into view.
function countUp() {
  gsap.utils.toArray("[data-count-to]").forEach(function (el) {
    const target = Number(el.getAttribute("data-count-to"));
    if (isNaN(target)) return;
    const decimals = Number(el.getAttribute("data-count-decimals") || 0);
    const template = el.getAttribute("data-count-template") || "{value}";
    const counter = { value: 0 };
    const show = function () { el.textContent = fill(template, { value: counter.value.toFixed(decimals) }); };
    show();
    gsap.to(counter, { value: target, duration: 1.4, ease: "power2.out", onUpdate: show,
      scrollTrigger: { trigger: el, start: "top 96%", once: true } });
  });
}


/* ---------- 10. Start-up ---------- */
function start() {
  // The website version has ONLINE_DATABASE at the top of PART 1; the downloaded file does not.
  webMode = !hosted && typeof ONLINE_DATABASE !== "undefined";
  cloudMode = hosted || webMode;
  db = loadDb();
  session = loadSession();
  state = isStudent() ? loadStudentState(db.students[session.email]) : freshState();
  ui = freshUi();
  checkConfig();
  setFavicon();
  setupMotion();
  startOnline();   // inside claude.ai: connect to the shared database (the page works before it answers)
  render({ scrollTop: true });
  window.addEventListener("hashchange", onPageChange);
  window.addEventListener("storage", onSharedChange);
  window.setInterval(refreshTimes, 30000);
  window.addEventListener("resize", function () { updateHeaderOffset(); updateActivePill(); });
}
// Wait until the whole file has loaded (including the PHOTOS block at the end), then start.
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();
</script>
